# Bandit Security Configuration
# Comprehensive SAST configuration for institutional-grade security scanning

# Test selection
tests:
  # High-severity security tests (always enabled)
  - B101  # assert_used
  - B102  # exec_used
  - B103  # set_bad_file_permissions
  - B104  # hardcoded_bind_all_interfaces
  - B105  # hardcoded_password_string
  - B106  # hardcoded_password_funcarg
  - B107  # hardcoded_password_default
  - B108  # hardcoded_tmp_directory
  - B110  # try_except_pass
  - B112  # try_except_continue
  - B201  # flask_debug_true
  - B301  # pickle
  - B302  # marshal
  - B303  # md5
  - B304  # des
  - B305  # cipher
  - B306  # mktemp_q
  - B307  # eval
  - B308  # mark_safe
  - B309  # httpsconnection
  - B310  # urllib_urlopen
  - B311  # random
  - B312  # telnetlib
  - B313  # xml_bad_cElementTree
  - B314  # xml_bad_ElementTree
  - B315  # xml_bad_expatreader
  - B316  # xml_bad_expatbuilder
  - B317  # xml_bad_sax
  - B318  # xml_bad_minidom
  - B319  # xml_bad_pulldom
  - B320  # xml_bad_etree
  - B321  # ftplib
  - B322  # input
  - B323  # unverified_context
  - B324  # hashlib_new_insecure_functions
  - B325  # tempnam
  - B401  # import_telnetlib
  - B402  # import_ftplib
  - B403  # import_pickle
  - B404  # import_subprocess
  - B405  # import_xml_etree
  - B406  # import_xml_sax
  - B407  # import_xml_expat
  - B408  # import_xml_minidom
  - B409  # import_xml_pulldom
  - B410  # import_lxml
  - B411  # import_xmlrpclib
  - B412  # import_httpoxy
  - B413  # import_pycrypto
  - B501  # request_with_no_cert_validation
  - B502  # ssl_with_bad_version
  - B503  # ssl_with_bad_defaults
  - B504  # ssl_with_no_version
  - B505  # weak_cryptographic_key
  - B506  # yaml_load
  - B507  # ssh_no_host_key_verification
  - B601  # paramiko_calls
  - B602  # subprocess_popen_with_shell_equals_true
  - B603  # subprocess_without_shell_equals_false
  - B604  # any_other_function_with_shell_equals_true
  - B605  # start_process_with_a_shell
  - B606  # start_process_with_no_shell
  - B607  # start_process_with_partial_path
  - B608  # hardcoded_sql_expressions
  - B609  # linux_commands_wildcard_injection
  - B610  # django_extra_used
  - B611  # django_rawsql_used
  - B701  # jinja2_autoescape_false
  - B702  # use_of_mako_templates
  - B703  # django_mark_safe

# Skip specific tests for false positives
skips:
  # Skip tests that may have false positives in trading context
  # - B311  # Allow random for non-cryptographic purposes (backtesting)

# Exclude paths
exclude_dirs:
  - '/tests/'
  - '/test/'
  - '/.venv/'
  - '/venv/'
  - '/env/'
  - '/.git/'
  - '/node_modules/'
  - '/__pycache__/'
  - '/.pytest_cache/'
  - '/build/'
  - '/dist/'
  - '/docs/'
  - '/examples/'
  - '/samples/'

# Severity levels
severity:
  # Only report medium and high severity issues
  level: 'medium'
  
# Confidence levels
confidence:
  # Only report medium and high confidence issues
  level: 'medium'

# Output format
format: 'json'

# Additional security rules for trading systems
custom_rules:
  # Financial data protection
  financial_data_exposure:
    pattern: '(api_key|secret|password|token)\s*=\s*["\'][^"\'
]*["\']'
    severity: 'HIGH'
    message: 'Potential hardcoded financial API credentials detected'
    
  # Database connection strings
  db_connection_exposure:
    pattern: '(mongodb://|postgresql://|mysql://|redis://)[^\s]*'
    severity: 'HIGH'
    message: 'Database connection string may contain credentials'
    
  # Trading API endpoints
  trading_api_exposure:
    pattern: '(broker|trading|market).*api.*key'
    severity: 'HIGH'
    message: 'Trading API key pattern detected'
    
  # Logging sensitive data
  sensitive_logging:
    pattern: 'log.*\.(info|debug|warning).*\b(password|secret|key|token)\b'
    severity: 'MEDIUM'
    message: 'Potential logging of sensitive information'

# Institutional compliance requirements
compliance:
  # SOX compliance for financial systems
  sox_requirements:
    - 'No hardcoded credentials'
    - 'Secure random number generation'
    - 'Input validation and sanitization'
    - 'Secure communication protocols'
    - 'Audit trail preservation'
    
  # PCI DSS requirements (if handling payment data)
  pci_requirements:
    - 'Strong cryptography'
    - 'Secure key management'
    - 'Access control measures'
    - 'Regular security testing'
    
  # GDPR requirements (if handling EU data)
  gdpr_requirements:
    - 'Data encryption at rest and in transit'
    - 'Secure data processing'
    - 'Privacy by design'

# Reporting configuration
reporting:
  # Generate detailed reports
  detailed: true
  
  # Include remediation suggestions
  remediation: true
  
  # Include compliance mapping
  compliance_mapping: true
  
  # Output formats
  formats:
    - 'json'
    - 'html'
    - 'txt'
    
  # Report sections
  sections:
    - 'executive_summary'
    - 'detailed_findings'
    - 'remediation_plan'
    - 'compliance_status'
    - 'risk_assessment'

# Integration settings
integration:
  # CI/CD pipeline integration
  ci_cd:
    fail_on_high: true
    fail_on_medium: false
    max_issues: 0  # Fail if any high-severity issues found
    
  # IDE integration
  ide:
    real_time_scanning: true
    inline_suggestions: true
    
  # Security dashboard integration
  dashboard:
    webhook_url: '${SECURITY_WEBHOOK_URL}'
    alert_channels:
      - 'teams'
      - 'discord'
      - 'email'

# Advanced configuration
advanced:
  # Custom security patterns for trading systems
  trading_patterns:
    # Market data validation
    - pattern: 'price.*[<>]=?\s*0'
      message: 'Potential price validation issue'
      severity: 'MEDIUM'
      
    # Order validation
    - pattern: 'quantity.*[<>]=?\s*0'
      message: 'Potential quantity validation issue'
      severity: 'MEDIUM'
      
    # Risk management
    - pattern: 'risk.*limit.*[<>]=?\s*[0-9.]+'
      message: 'Risk limit validation required'
      severity: 'HIGH'
      
  # Performance considerations
  performance:
    timeout: 300  # 5 minutes max scan time
    max_file_size: '10MB'
    parallel_processing: true
    
  # Memory management
  memory:
    max_memory: '2GB'
    cleanup_temp_files: true

# Plugin configuration
plugins:
  # Enable additional security plugins
  enabled:
    - 'secrets_detection'
    - 'dependency_check'
    - 'license_check'
    - 'code_quality'
    
  # Plugin-specific settings
  secrets_detection:
    entropy_threshold: 4.5
    custom_patterns:
      - 'IBKR_.*'
      - 'OANDA_.*'
      - 'COINBASE_.*'
      
  dependency_check:
    vulnerability_db: 'nvd'
    update_frequency: 'daily'
    
  license_check:
    allowed_licenses:
      - 'MIT'
      - 'Apache-2.0'
      - 'BSD-3-Clause'
      - 'GPL-3.0'
    
    prohibited_licenses:
      - 'AGPL-3.0'
      - 'GPL-2.0'

# Notification settings
notifications:
  # Alert thresholds
  thresholds:
    critical: 1
    high: 3
    medium: 10
    
  # Notification channels
  channels:
    teams:
      webhook: '${TEAMS_SECURITY_WEBHOOK}'
      template: 'security_alert'
      
    discord:
      webhook: '${DISCORD_SECURITY_WEBHOOK}'
      template: 'security_embed'
      
    email:
      recipients: '${SECURITY_EMAIL_LIST}'
      template: 'security_report'
      
  # Escalation rules
  escalation:
    - condition: 'critical >= 1'
      action: 'immediate_alert'
      channels: ['teams', 'discord', 'email']
      
    - condition: 'high >= 5'
      action: 'urgent_alert'
      channels: ['teams', 'email']
      
    - condition: 'medium >= 20'
      action: 'standard_alert'
      channels: ['discord']