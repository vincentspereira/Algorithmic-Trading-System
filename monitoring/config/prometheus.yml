global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Trading System Monitoring Infrastructure
  - job_name: 'trading-system-monitoring'
    static_configs:
      - targets: ['monitoring-infrastructure:8091']
    scrape_interval: 10s
    metrics_path: '/metrics'
    
  # System Metrics
  - job_name: 'system-metrics'
    static_configs:
      - targets: ['monitoring-infrastructure:8090']
    scrape_interval: 15s
    metrics_path: '/metrics'
    
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
  # Node Exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    
  # Trading Application Metrics (when available)
  - job_name: 'trading-app'
    static_configs:
      - targets: ['trading-app:8080']
    scrape_interval: 10s
    metrics_path: '/metrics'
    
  # Redis Metrics (if redis_exporter is available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s