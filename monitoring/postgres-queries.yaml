# PostgreSQL Exporter Custom Queries for Trading System
# Extended monitoring for trading-specific database metrics

# Database connection and activity metrics
pg_database:
  query: |
    SELECT 
      datname as database,
      numbackends as active_connections,
      xact_commit as transactions_committed,
      xact_rollback as transactions_rolled_back,
      blks_read as blocks_read,
      blks_hit as blocks_hit,
      tup_returned as tuples_returned,
      tup_fetched as tuples_fetched,
      tup_inserted as tuples_inserted,
      tup_updated as tuples_updated,
      tup_deleted as tuples_deleted,
      conflicts as conflicts,
      temp_files as temp_files,
      temp_bytes as temp_bytes,
      deadlocks as deadlocks,
      blk_read_time as block_read_time_ms,
      blk_write_time as block_write_time_ms
    FROM pg_stat_database
    WHERE datname NOT IN ('template0', 'template1')
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - active_connections:
        usage: "GAUGE"
        description: "Number of active connections to database"
    - transactions_committed:
        usage: "COUNTER"
        description: "Number of transactions committed"
    - transactions_rolled_back:
        usage: "COUNTER"
        description: "Number of transactions rolled back"
    - blocks_read:
        usage: "COUNTER"
        description: "Number of disk blocks read"
    - blocks_hit:
        usage: "COUNTER"
        description: "Number of buffer hits"
    - tuples_returned:
        usage: "COUNTER"
        description: "Number of rows returned by queries"
    - tuples_fetched:
        usage: "COUNTER"
        description: "Number of rows fetched by queries"
    - tuples_inserted:
        usage: "COUNTER"
        description: "Number of rows inserted"
    - tuples_updated:
        usage: "COUNTER"
        description: "Number of rows updated"
    - tuples_deleted:
        usage: "COUNTER"
        description: "Number of rows deleted"
    - conflicts:
        usage: "COUNTER"
        description: "Number of queries canceled due to conflicts"
    - temp_files:
        usage: "COUNTER"
        description: "Number of temporary files created"
    - temp_bytes:
        usage: "COUNTER"
        description: "Total amount of data written to temporary files"
    - deadlocks:
        usage: "COUNTER"
        description: "Number of deadlocks detected"
    - block_read_time_ms:
        usage: "COUNTER"
        description: "Time spent reading data file blocks by backends"
    - block_write_time_ms:
        usage: "COUNTER"
        description: "Time spent writing data file blocks by backends"

# Table-level statistics for trading tables
pg_trading_tables:
  query: |
    SELECT 
      schemaname as schema,
      tablename as table,
      seq_scan as sequential_scans,
      seq_tup_read as sequential_tuples_read,
      idx_scan as index_scans,
      idx_tup_fetch as index_tuples_fetched,
      n_tup_ins as tuples_inserted,
      n_tup_upd as tuples_updated,
      n_tup_del as tuples_deleted,
      n_tup_hot_upd as hot_updates,
      n_live_tup as live_tuples,
      n_dead_tup as dead_tuples,
      n_mod_since_analyze as modifications_since_analyze,
      last_vacuum,
      last_autovacuum,
      last_analyze,
      last_autoanalyze,
      vacuum_count,
      autovacuum_count,
      analyze_count,
      autoanalyze_count
    FROM pg_stat_user_tables
    WHERE schemaname IN ('trading', 'market_data', 'portfolio', 'risk')
       OR tablename LIKE '%trade%' 
       OR tablename LIKE '%order%'
       OR tablename LIKE '%position%'
       OR tablename LIKE '%price%'
  metrics:
    - schema:
        usage: "LABEL"
        description: "Schema name"
    - table:
        usage: "LABEL"
        description: "Table name"
    - sequential_scans:
        usage: "COUNTER"
        description: "Number of sequential scans initiated on this table"
    - sequential_tuples_read:
        usage: "COUNTER"
        description: "Number of live rows fetched by sequential scans"
    - index_scans:
        usage: "COUNTER"
        description: "Number of index scans initiated on this table"
    - index_tuples_fetched:
        usage: "COUNTER"
        description: "Number of live rows fetched by index scans"
    - tuples_inserted:
        usage: "COUNTER"
        description: "Number of rows inserted"
    - tuples_updated:
        usage: "COUNTER"
        description: "Number of rows updated"
    - tuples_deleted:
        usage: "COUNTER"
        description: "Number of rows deleted"
    - hot_updates:
        usage: "COUNTER"
        description: "Number of rows HOT updated"
    - live_tuples:
        usage: "GAUGE"
        description: "Estimated number of live rows"
    - dead_tuples:
        usage: "GAUGE"
        description: "Estimated number of dead rows"
    - modifications_since_analyze:
        usage: "GAUGE"
        description: "Estimated number of rows modified since last analyze"
    - vacuum_count:
        usage: "COUNTER"
        description: "Number of times this table has been manually vacuumed"
    - autovacuum_count:
        usage: "COUNTER"
        description: "Number of times this table has been vacuumed by autovacuum"
    - analyze_count:
        usage: "COUNTER"
        description: "Number of times this table has been manually analyzed"
    - autoanalyze_count:
        usage: "COUNTER"
        description: "Number of times this table has been analyzed by autoanalyze"

# Index usage statistics
pg_index_usage:
  query: |
    SELECT 
      schemaname as schema,
      tablename as table,
      indexname as index,
      idx_scan as index_scans,
      idx_tup_read as index_tuples_read,
      idx_tup_fetch as index_tuples_fetched
    FROM pg_stat_user_indexes
    WHERE schemaname IN ('trading', 'market_data', 'portfolio', 'risk')
       OR tablename LIKE '%trade%' 
       OR tablename LIKE '%order%'
       OR tablename LIKE '%position%'
       OR tablename LIKE '%price%'
  metrics:
    - schema:
        usage: "LABEL"
        description: "Schema name"
    - table:
        usage: "LABEL"
        description: "Table name"
    - index:
        usage: "LABEL"
        description: "Index name"
    - index_scans:
        usage: "COUNTER"
        description: "Number of index scans initiated on this index"
    - index_tuples_read:
        usage: "COUNTER"
        description: "Number of index entries returned by scans on this index"
    - index_tuples_fetched:
        usage: "COUNTER"
        description: "Number of live table rows fetched by simple index scans"

# Connection and lock monitoring
pg_locks:
  query: |
    SELECT 
      mode,
      locktype,
      database,
      relation,
      page,
      tuple,
      virtualxid,
      transactionid,
      classid,
      objid,
      objsubid,
      virtualtransaction,
      pid,
      granted,
      fastpath,
      COUNT(*) as lock_count
    FROM pg_locks
    GROUP BY mode, locktype, database, relation, page, tuple, virtualxid, 
             transactionid, classid, objid, objsubid, virtualtransaction, 
             pid, granted, fastpath
  metrics:
    - mode:
        usage: "LABEL"
        description: "Lock mode"
    - locktype:
        usage: "LABEL"
        description: "Type of lockable object"
    - database:
        usage: "LABEL"
        description: "Database OID"
    - granted:
        usage: "LABEL"
        description: "True if lock is held, false if lock is awaited"
    - lock_count:
        usage: "GAUGE"
        description: "Number of locks of this type"

# Long running queries (potential issues)
pg_long_running_queries:
  query: |
    SELECT 
      datname as database,
      usename as username,
      application_name,
      client_addr,
      state,
      EXTRACT(EPOCH FROM (now() - query_start)) as query_duration_seconds,
      EXTRACT(EPOCH FROM (now() - state_change)) as state_duration_seconds,
      waiting,
      COUNT(*) as query_count
    FROM pg_stat_activity 
    WHERE state != 'idle' 
      AND query_start IS NOT NULL
      AND EXTRACT(EPOCH FROM (now() - query_start)) > 30
    GROUP BY datname, usename, application_name, client_addr, state, 
             query_duration_seconds, state_duration_seconds, waiting
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - username:
        usage: "LABEL"
        description: "User name"
    - application_name:
        usage: "LABEL"
        description: "Application name"
    - client_addr:
        usage: "LABEL"
        description: "Client IP address"
    - state:
        usage: "LABEL"
        description: "Current overall state of this backend"
    - waiting:
        usage: "LABEL"
        description: "True if this backend is currently waiting on a lock"
    - query_duration_seconds:
        usage: "GAUGE"
        description: "Time in seconds since query started"
    - state_duration_seconds:
        usage: "GAUGE"
        description: "Time in seconds since state changed"
    - query_count:
        usage: "GAUGE"
        description: "Number of long running queries"

# Replication lag (if using streaming replication)
pg_replication_lag:
  query: |
    SELECT 
      client_addr,
      client_hostname,
      client_port,
      state,
      sent_lsn,
      write_lsn,
      flush_lsn,
      replay_lsn,
      write_lag,
      flush_lag,
      replay_lag,
      sync_priority,
      sync_state
    FROM pg_stat_replication
  metrics:
    - client_addr:
        usage: "LABEL"
        description: "IP address of the client connected to this WAL sender"
    - client_hostname:
        usage: "LABEL"
        description: "Host name of the connected client"
    - state:
        usage: "LABEL"
        description: "Current WAL sender state"
    - sync_state:
        usage: "LABEL"
        description: "Synchronous state of this standby server"
    - write_lag:
        usage: "GAUGE"
        description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written it"
    - flush_lag:
        usage: "GAUGE"
        description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written and flushed it"
    - replay_lag:
        usage: "GAUGE"
        description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written, flushed and applied it"
    - sync_priority:
        usage: "GAUGE"
        description: "Priority of this standby server for being chosen as the synchronous standby"

# Trading-specific table sizes
pg_trading_table_sizes:
  query: |
    SELECT 
      schemaname as schema,
      tablename as table,
      pg_total_relation_size(schemaname||'.'||tablename) as total_size_bytes,
      pg_relation_size(schemaname||'.'||tablename) as table_size_bytes,
      pg_indexes_size(schemaname||'.'||tablename) as indexes_size_bytes
    FROM pg_tables 
    WHERE schemaname IN ('trading', 'market_data', 'portfolio', 'risk')
       OR tablename LIKE '%trade%' 
       OR tablename LIKE '%order%'
       OR tablename LIKE '%position%'
       OR tablename LIKE '%price%'
  metrics:
    - schema:
        usage: "LABEL"
        description: "Schema name"
    - table:
        usage: "LABEL"
        description: "Table name"
    - total_size_bytes:
        usage: "GAUGE"
        description: "Total size of table including indexes and TOAST data"
    - table_size_bytes:
        usage: "GAUGE"
        description: "Size of table excluding indexes"
    - indexes_size_bytes:
        usage: "GAUGE"
        description: "Size of indexes on table"

# WAL (Write-Ahead Logging) statistics
pg_wal_stats:
  query: |
    SELECT 
      wal_records,
      wal_fpi,
      wal_bytes,
      wal_buffers_full,
      wal_write,
      wal_sync,
      wal_write_time,
      wal_sync_time,
      stats_reset
    FROM pg_stat_wal
  metrics:
    - wal_records:
        usage: "COUNTER"
        description: "Total number of WAL records generated"
    - wal_fpi:
        usage: "COUNTER"
        description: "Total number of WAL full page images generated"
    - wal_bytes:
        usage: "COUNTER"
        description: "Total amount of WAL generated in bytes"
    - wal_buffers_full:
        usage: "COUNTER"
        description: "Number of times WAL data was written to disk because WAL buffers became full"
    - wal_write:
        usage: "COUNTER"
        description: "Number of times WAL buffers were written out to disk via XLogWrite request"
    - wal_sync:
        usage: "COUNTER"
        description: "Number of times WAL files were synced to disk via issue_xlog_fsync request"
    - wal_write_time:
        usage: "COUNTER"
        description: "Total amount of time spent writing WAL buffers to disk via XLogWrite request"
    - wal_sync_time:
        usage: "COUNTER"
        description: "Total amount of time spent syncing WAL files to disk via issue_xlog_fsync request"