# Alertmanager Configuration for Trading System
# Handles alert routing, grouping, and notifications

global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@trading-system.local'
  smtp_auth_username: 'alerts@trading-system.local'
  smtp_auth_password: 'alert_password'
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
  resolve_timeout: 5m

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert routing
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    # Critical trading system alerts
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 5m
      routes:
        - match:
            alertname: TradingEngineDown
          receiver: 'trading-engine-critical'
        - match:
            alertname: DatabaseConnectionLost
          receiver: 'database-critical'
        - match:
            alertname: OrderExecutionFailed
          receiver: 'order-execution-critical'
    
    # Warning level alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 30m
    
    # Database specific alerts
    - match:
        service: database
      receiver: 'database-alerts'
      group_by: ['alertname', 'instance', 'database']
    
    # Trading system alerts
    - match:
        service: trading
      receiver: 'trading-alerts'
      group_by: ['alertname', 'strategy', 'symbol']
    
    # Infrastructure alerts
    - match:
        service: infrastructure
      receiver: 'infrastructure-alerts'
      group_by: ['alertname', 'instance']

# Alert receivers and notification channels
receivers:
  # Default receiver for unmatched alerts
  - name: 'default-receiver'
    email_configs:
      - to: 'admin@trading-system.local'
        subject: '[Trading System] Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}
  
  # Critical alerts - immediate notification
  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@trading-system.local,ops@trading-system.local'
        subject: '[CRITICAL] Trading System Alert: {{ .GroupLabels.alertname }}'
        body: |
          🚨 CRITICAL ALERT 🚨
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ if .EndsAt }}Ended: {{ .EndsAt }}{{ end }}
          
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#trading-alerts'
        title: '🚨 Critical Trading System Alert'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}
  
  # Trading engine critical alerts
  - name: 'trading-engine-critical'
    email_configs:
      - to: 'trading-team@trading-system.local'
        subject: '[URGENT] Trading Engine Alert: {{ .GroupLabels.alertname }}'
        body: |
          🔴 TRADING ENGINE ALERT 🔴
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Impact: Trading operations may be affected
          Action Required: Immediate investigation needed
          
          Details:
          - Service: {{ .Labels.service }}
          - Instance: {{ .Labels.instance }}
          - Started: {{ .StartsAt }}
          {{ end }}
  
  # Database critical alerts
  - name: 'database-critical'
    email_configs:
      - to: 'dba@trading-system.local,ops@trading-system.local'
        subject: '[URGENT] Database Alert: {{ .GroupLabels.alertname }}'
        body: |
          💾 DATABASE CRITICAL ALERT 💾
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Database: {{ .Labels.database }}
          Instance: {{ .Labels.instance }}
          
          Impact: Data operations may be affected
          Action Required: Immediate database investigation
          {{ end }}
  
  # Order execution critical alerts
  - name: 'order-execution-critical'
    email_configs:
      - to: 'trading-team@trading-system.local,risk@trading-system.local'
        subject: '[URGENT] Order Execution Alert: {{ .GroupLabels.alertname }}'
        body: |
          📈 ORDER EXECUTION ALERT 📈
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Symbol: {{ .Labels.symbol }}
          Strategy: {{ .Labels.strategy }}
          
          Impact: Trading orders may not be executing properly
          Action Required: Check order management system
          {{ end }}
  
  # Warning level alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'ops@trading-system.local'
        subject: '[Warning] Trading System: {{ .GroupLabels.alertname }}'
        body: |
          ⚠️ WARNING ALERT ⚠️
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}
  
  # Database specific alerts
  - name: 'database-alerts'
    email_configs:
      - to: 'dba@trading-system.local'
        subject: '[Database] Alert: {{ .GroupLabels.alertname }}'
        body: |
          💾 DATABASE ALERT 💾
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Database: {{ .Labels.database }}
          Instance: {{ .Labels.instance }}
          Severity: {{ .Labels.severity }}
          {{ end }}
  
  # Trading system alerts
  - name: 'trading-alerts'
    email_configs:
      - to: 'trading-team@trading-system.local'
        subject: '[Trading] Alert: {{ .GroupLabels.alertname }}'
        body: |
          📊 TRADING SYSTEM ALERT 📊
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Strategy: {{ .Labels.strategy }}
          Symbol: {{ .Labels.symbol }}
          Severity: {{ .Labels.severity }}
          {{ end }}
  
  # Infrastructure alerts
  - name: 'infrastructure-alerts'
    email_configs:
      - to: 'ops@trading-system.local'
        subject: '[Infrastructure] Alert: {{ .GroupLabels.alertname }}'
        body: |
          🖥️ INFRASTRUCTURE ALERT 🖥️
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Severity: {{ .Labels.severity }}
          {{ end }}

# Inhibition rules to prevent alert spam
inhibit_rules:
  # Inhibit warning alerts when critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
  
  # Inhibit database connection alerts when database is down
  - source_match:
      alertname: 'DatabaseDown'
    target_match_re:
      alertname: 'Database.*'
    equal: ['instance', 'database']
  
  # Inhibit service alerts when node is down
  - source_match:
      alertname: 'NodeDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']