global:
  # Global configuration
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@trading-system.com'
  smtp_auth_username: 'alerts@trading-system.com'
  smtp_auth_password: 'your-smtp-password'
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert routing
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    # Critical trading system alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      group_interval: 5s
      repeat_interval: 15m
      routes:
        # Trading engine specific critical alerts
        - match:
            component: trading-engine
          receiver: 'trading-engine-critical'
          group_wait: 0s
          repeat_interval: 5m
        
        # Risk management critical alerts
        - match:
            component: risk-management
          receiver: 'risk-management-critical'
          group_wait: 0s
          repeat_interval: 5m
        
        # Security critical alerts
        - match:
            component: security
          receiver: 'security-critical'
          group_wait: 0s
          repeat_interval: 10m
        
        # Compliance critical alerts
        - match:
            component: compliance
          receiver: 'compliance-critical'
          group_wait: 0s
          repeat_interval: 5m

    # Warning level alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
      routes:
        # Infrastructure warnings
        - match:
            component: infrastructure
          receiver: 'infrastructure-warnings'
          repeat_interval: 4h
        
        # Database warnings
        - match:
            component: database
          receiver: 'database-warnings'
          repeat_interval: 1h
        
        # AI/ML model warnings
        - match:
            component: ai-ml
          receiver: 'ai-ml-warnings'
          repeat_interval: 6h

    # Market hours vs after hours routing
    - match_re:
        alertname: '.*'
      receiver: 'market-hours-alerts'
      active_time_intervals:
        - 'market-hours'
    
    - match_re:
        alertname: '.*'
      receiver: 'after-hours-alerts'
      active_time_intervals:
        - 'after-hours'

# Time intervals for market hours
time_intervals:
  - name: 'market-hours'
    time_intervals:
      - times:
          - start_time: '09:30'
            end_time: '16:00'
        weekdays: ['monday:friday']
        location: 'America/New_York'
  
  - name: 'after-hours'
    time_intervals:
      - times:
          - start_time: '16:00'
            end_time: '09:30'
        weekdays: ['monday:friday']
        location: 'America/New_York'
      - weekdays: ['saturday', 'sunday']
        location: 'America/New_York'

# Inhibition rules to reduce noise
inhibit_rules:
  # If trading engine is down, inhibit all other trading-related alerts
  - source_matchers:
      - alertname = "TradingEngineDown"
    target_matchers:
      - component =~ "trading-.*|order-.*|strategy.*"
    equal: ['instance']
  
  # If database is down, inhibit database-related alerts
  - source_matchers:
      - alertname = "DatabaseDown"
    target_matchers:
      - component = "database"
    equal: ['instance']
  
  # If high CPU, inhibit memory alerts (likely related)
  - source_matchers:
      - alertname = "HighCPUUsage"
    target_matchers:
      - alertname = "HighMemoryUsage"
    equal: ['instance']

# Alert receivers configuration
receivers:
  # Default receiver
  - name: 'default-receiver'
    email_configs:
      - to: 'ops-team@trading-system.com'
        subject: '[Trading System] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'critical-alerts@trading-system.com'
        subject: '[CRITICAL] Trading System Alert: {{ .GroupLabels.alertname }}'
        body: |
          🚨 CRITICAL ALERT 🚨
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Component: {{ .Labels.component }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          {{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}
    
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/CRITICAL/WEBHOOK'
        channel: '#trading-alerts-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Component:* {{ .Labels.component }}
          *Time:* {{ .StartsAt.Format "15:04:05" }}
          {{ end }}
        send_resolved: true
    
    pagerduty_configs:
      - routing_key: 'your-pagerduty-integration-key'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        severity: 'critical'

  # Trading engine critical alerts
  - name: 'trading-engine-critical'
    email_configs:
      - to: 'trading-team@trading-system.com,ops-team@trading-system.com'
        subject: '[TRADING ENGINE DOWN] Immediate Action Required'
        body: |
          🚨 TRADING ENGINE CRITICAL ALERT 🚨
          
          The trading engine is experiencing critical issues that require immediate attention.
          All trading operations may be affected.
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
          
          Please follow the emergency response procedures immediately.
    
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/TRADING/WEBHOOK'
        channel: '#trading-engine-alerts'
        title: '🚨 TRADING ENGINE CRITICAL'
        text: |
          @channel IMMEDIATE ACTION REQUIRED
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  # Risk management critical alerts
  - name: 'risk-management-critical'
    email_configs:
      - to: 'risk-team@trading-system.com,compliance@trading-system.com'
        subject: '[RISK ALERT] {{ .GroupLabels.alertname }}'
        body: |
          ⚠️ RISK MANAGEMENT ALERT ⚠️
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
    
    slack_configs:
      - channel: '#risk-alerts'
        title: '⚠️ RISK ALERT: {{ .GroupLabels.alertname }}'

  # Security critical alerts
  - name: 'security-critical'
    email_configs:
      - to: 'security-team@trading-system.com,ops-team@trading-system.com'
        subject: '[SECURITY ALERT] {{ .GroupLabels.alertname }}'
        body: |
          🔒 SECURITY ALERT 🔒
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
    
    slack_configs:
      - channel: '#security-alerts'
        title: '🔒 SECURITY ALERT: {{ .GroupLabels.alertname }}'

  # Compliance critical alerts
  - name: 'compliance-critical'
    email_configs:
      - to: 'compliance@trading-system.com,legal@trading-system.com'
        subject: '[COMPLIANCE VIOLATION] {{ .GroupLabels.alertname }}'
        body: |
          ⚖️ COMPLIANCE ALERT ⚖️
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  # Warning level alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'ops-team@trading-system.com'
        subject: '[WARNING] {{ .GroupLabels.alertname }}'
        body: |
          ⚠️ Warning Alert
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Component: {{ .Labels.component }}
          {{ end }}
    
    slack_configs:
      - channel: '#trading-alerts-warning'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'

  # Infrastructure warnings
  - name: 'infrastructure-warnings'
    email_configs:
      - to: 'infrastructure@trading-system.com'
        subject: '[INFRA WARNING] {{ .GroupLabels.alertname }}'
    
    slack_configs:
      - channel: '#infrastructure-alerts'
        title: '🖥️ INFRA WARNING: {{ .GroupLabels.alertname }}'

  # Database warnings
  - name: 'database-warnings'
    email_configs:
      - to: 'database-team@trading-system.com'
        subject: '[DB WARNING] {{ .GroupLabels.alertname }}'
    
    slack_configs:
      - channel: '#database-alerts'
        title: '🗄️ DB WARNING: {{ .GroupLabels.alertname }}'

  # AI/ML warnings
  - name: 'ai-ml-warnings'
    email_configs:
      - to: 'ai-team@trading-system.com'
        subject: '[AI/ML WARNING] {{ .GroupLabels.alertname }}'
    
    slack_configs:
      - channel: '#ai-ml-alerts'
        title: '🤖 AI/ML WARNING: {{ .GroupLabels.alertname }}'

  # Market hours alerts
  - name: 'market-hours-alerts'
    email_configs:
      - to: 'trading-desk@trading-system.com'
        subject: '[MARKET HOURS] {{ .GroupLabels.alertname }}'
    
    slack_configs:
      - channel: '#trading-desk'
        title: '📈 MARKET HOURS ALERT: {{ .GroupLabels.alertname }}'

  # After hours alerts (reduced urgency)
  - name: 'after-hours-alerts'
    email_configs:
      - to: 'on-call@trading-system.com'
        subject: '[AFTER HOURS] {{ .GroupLabels.alertname }}'
    
    slack_configs:
      - channel: '#after-hours-alerts'
        title: '🌙 AFTER HOURS: {{ .GroupLabels.alertname }}'