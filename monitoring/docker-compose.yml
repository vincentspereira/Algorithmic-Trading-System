services:
  monitoring-infrastructure:
    build:
      context: ..
      dockerfile: monitoring/Dockerfile
    container_name: monitoring_infrastructure
    ports:
      - "8090:8090"  # Main monitoring API
      - "8091:8091"  # Metrics endpoint
      - "8092:8092"  # Health dashboard
    volumes:
      - ..:/app
      - monitoring_data:/app/data
      - monitoring_config:/app/config
    environment:
      - PYTHONPATH=/app
      - MONITORING_MODE=production
      - LOG_LEVEL=INFO
      - METRICS_RETENTION_DAYS=30
    networks:
      - monitoring_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - monitoring_network
    restart: unless-stopped
    depends_on:
      - prometheus

  redis:
    image: redis:7-alpine
    container_name: monitoring_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - monitoring_network
    restart: unless-stopped

  monitoring-test:
    build:
      context: ..
      dockerfile: monitoring/Dockerfile
    container_name: monitoring_test
    volumes:
      - ..:/app
    environment:
      - PYTHONPATH=/app
      - MONITORING_TEST_MODE=true
    command: python monitoring/test_monitoring_infrastructure.py
    networks:
      - monitoring_network
    depends_on:
      - monitoring-infrastructure
      - prometheus
      - grafana
      - redis

volumes:
  monitoring_data:
  monitoring_config:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  monitoring_network:
    driver: bridge