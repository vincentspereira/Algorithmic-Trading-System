apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nautilus-trader-api-custom-hpa
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nautilus-trader-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
  # CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric: HTTP requests per second
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  # Custom metric: Active trading sessions
  - type: Pods
    pods:
      metric:
        name: active_trading_sessions
      target:
        type: AverageValue
        averageValue: "100"
  # Custom metric: Queue depth
  - type: Pods
    pods:
      metric:
        name: message_queue_depth
      target:
        type: AverageValue
        averageValue: "1000"
  # Custom metric: Database connections
  - type: Pods
    pods:
      metric:
        name: database_connections
      target:
        type: AverageValue
        averageValue: "50"
  # External metric: Market volatility
  - type: External
    external:
      metric:
        name: market_volatility_index
      target:
        type: Value
        value: "0.5"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nautilus-trader-websocket-custom-hpa
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: websocket
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nautilus-trader-websocket
  minReplicas: 2
  maxReplicas: 20
  metrics:
  # CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric: WebSocket connections
  - type: Pods
    pods:
      metric:
        name: websocket_connections
      target:
        type: AverageValue
        averageValue: "1000"
  # Custom metric: Message throughput
  - type: Pods
    pods:
      metric:
        name: websocket_messages_per_second
      target:
        type: AverageValue
        averageValue: "5000"
  # Custom metric: Connection latency
  - type: Pods
    pods:
      metric:
        name: websocket_connection_latency_ms
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
      - type: Percent
        value: 15
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 3
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: nautilus-trader-custom-metrics
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nautilus-trader
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
    honorLabels: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: monitoring
data:
  config.yaml: |
    rules:
    # HTTP requests per second
    - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^http_requests_total"
        as: "http_requests_per_second"
      metricsQuery: 'rate(http_requests_total{<<.LabelMatchers>>}[2m])'
    
    # Active trading sessions
    - seriesQuery: 'trading_sessions_active{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^trading_sessions_active"
        as: "active_trading_sessions"
      metricsQuery: 'trading_sessions_active{<<.LabelMatchers>>}'
    
    # Message queue depth
    - seriesQuery: 'rabbitmq_queue_messages{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^rabbitmq_queue_messages"
        as: "message_queue_depth"
      metricsQuery: 'sum(rabbitmq_queue_messages{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
    
    # Database connections
    - seriesQuery: 'postgresql_connections{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^postgresql_connections"
        as: "database_connections"
      metricsQuery: 'postgresql_connections{<<.LabelMatchers>>}'
    
    # WebSocket connections
    - seriesQuery: 'websocket_connections_active{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^websocket_connections_active"
        as: "websocket_connections"
      metricsQuery: 'websocket_connections_active{<<.LabelMatchers>>}'
    
    # WebSocket messages per second
    - seriesQuery: 'websocket_messages_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^websocket_messages_total"
        as: "websocket_messages_per_second"
      metricsQuery: 'rate(websocket_messages_total{<<.LabelMatchers>>}[2m])'
    
    # WebSocket connection latency
    - seriesQuery: 'websocket_connection_latency_seconds{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^websocket_connection_latency_seconds"
        as: "websocket_connection_latency_ms"
      metricsQuery: 'websocket_connection_latency_seconds{<<.LabelMatchers>>} * 1000'
    
    # External metrics
    externalRules:
    - seriesQuery: 'market_volatility_index'
      name:
        matches: "^market_volatility_index"
        as: "market_volatility_index"
      metricsQuery: 'market_volatility_index'