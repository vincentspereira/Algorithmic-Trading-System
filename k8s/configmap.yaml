apiVersion: v1
kind: ConfigMap
metadata:
  name: nautilus-trader-config
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: config
data:
  # Application Configuration
  app.yaml: |
    app:
      name: "Nautilus Trader Engine"
      version: "1.0.0"
      environment: "production"
      debug: false
      log_level: "INFO"
      
    # Database Configuration
    database:
      host: "postgresql-service"
      port: "5432"
      name: "nautilus_trader"
      pool_size: 20
      max_overflow: 30
      
    # Redis Configuration
    redis:
      host: "redis-service"
      port: "6379"
      db: 0
      max_connections: 100
      
    # Message Queue Configuration
    rabbitmq:
      host: "rabbitmq-service"
      port: "5672"
      vhost: "/"
      
    # API Configuration
    api:
      host: "0.0.0.0"
      port: 8000
      workers: 4
      timeout: 30
      max_requests: 1000
      
    # GraphQL Configuration
    graphql:
      host: "0.0.0.0"
      port: 8001
      playground: true
      introspection: true
      
    # WebSocket Configuration
    websocket:
      host: "0.0.0.0"
      port: 8002
      max_connections: 1000
      
    # Monitoring Configuration
    monitoring:
      metrics_port: 9090
      health_check_port: 8080
      
  # Logging Configuration
  logging.yaml: |
    version: 1
    disable_existing_loggers: false
    formatters:
      standard:
        format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
      json:
        format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "message": "%(message)s"}'
    handlers:
      console:
        class: logging.StreamHandler
        level: INFO
        formatter: json
        stream: ext://sys.stdout
      file:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: standard
        filename: /var/log/nautilus-trader/app.log
        maxBytes: 10485760
        backupCount: 5
    loggers:
      nautilus_trader:
        level: INFO
        handlers: [console, file]
        propagate: false
    root:
      level: INFO
      handlers: [console]
      
  # Nginx Configuration
  nginx.conf: |
    upstream api_backend {
        server nautilus-trader-api:8000;
    }
    
    upstream graphql_backend {
        server nautilus-trader-graphql:8001;
    }
    
    upstream websocket_backend {
        server nautilus-trader-websocket:8002;
    }
    
    server {
        listen 80;
        server_name _;
        
        # API Routes
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # GraphQL Routes
        location /graphql {
            proxy_pass http://graphql_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # WebSocket Routes
        location /ws {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health Check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nautilus-trader-scripts
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: scripts
data:
  init-db.sh: |
    #!/bin/bash
    set -e
    
    echo "Initializing Nautilus Trader database..."
    
    # Wait for PostgreSQL to be ready
    until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; do
      echo "Waiting for PostgreSQL..."
      sleep 2
    done
    
    # Create database if it doesn't exist
    createdb -h $DB_HOST -p $DB_PORT -U $DB_USER $DB_NAME || true
    
    # Run migrations
    python -m nautilus_trader.database.migrate
    
    echo "Database initialization complete."
    
  health-check.sh: |
    #!/bin/bash
    
    # Check if the application is responding
    curl -f http://localhost:8080/health || exit 1
    
    # Check database connection
    python -c "
    import psycopg2
    import os
    try:
        conn = psycopg2.connect(
            host=os.environ['DB_HOST'],
            port=os.environ['DB_PORT'],
            database=os.environ['DB_NAME'],
            user=os.environ['DB_USER'],
            password=os.environ['DB_PASSWORD']
        )
        conn.close()
        print('Database connection OK')
    except Exception as e:
        print(f'Database connection failed: {e}')
        exit(1)
    " || exit 1
    
    # Check Redis connection
    python -c "
    import redis
    import os
    try:
        r = redis.Redis(
            host=os.environ['REDIS_HOST'],
            port=int(os.environ['REDIS_PORT']),
            db=int(os.environ['REDIS_DB'])
        )
        r.ping()
        print('Redis connection OK')
    except Exception as e:
        print(f'Redis connection failed: {e}')
        exit(1)
    " || exit 1
    
    echo "Health check passed"