apiVersion: v2
name: nautilus-trader
description: A Helm chart for Nautilus Trader - Advanced Algorithmic Trading Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/nautilus-trader/nautilus-trader
sources:
  - https://github.com/nautilus-trader/nautilus-trader
maintainers:
  - name: Nautilus Trader Team
    email: team@nautilus-trader.com
keywords:
  - trading
  - algorithmic
  - finance
  - kubernetes
  - microservices
dependencies:
  - name: postgresql
    version: "12.8.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.11.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: rabbitmq
    version: "12.0.10"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
  - name: prometheus
    version: "23.1.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "6.58.7"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.grafana.enabled