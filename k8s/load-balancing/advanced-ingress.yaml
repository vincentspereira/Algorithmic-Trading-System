apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nautilus-trader-advanced-ingress
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: ingress
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: "nginx"
    
    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-RSA-AES128-SHA,ECDHE-RSA-AES256-SHA,ECDHE-RSA-AES128-SHA256,ECDHE-RSA-AES256-SHA384"
    
    # Load Balancing
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    nginx.ingress.kubernetes.io/load-balance: "ewma"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "32"
    nginx.ingress.kubernetes.io/upstream-keepalive-requests: "100"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "60s"
    
    # Rate Limiting
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/rate-limit-status-code: "429"
    
    # Connection Limits
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-rps: "500"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    
    # Buffer Configuration
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "16k"
    
    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.nautilus-trader.com,https://dashboard.nautilus-trader.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    
    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
    
    # Caching
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        gzip_static on;
      }
      
      location /api/v1/health {
        access_log off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
      }
    
    # Monitoring
    nginx.ingress.kubernetes.io/enable-access-log: "true"
    nginx.ingress.kubernetes.io/enable-rewrite-log: "false"
    
    # Certificate Manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"
    
spec:
  tls:
  - hosts:
    - api.nautilus-trader.com
    - ws.nautilus-trader.com
    - admin.nautilus-trader.com
    secretName: nautilus-trader-tls
  rules:
  # API Endpoints
  - host: api.nautilus-trader.com
    http:
      paths:
      # Health check endpoint (no auth required)
      - path: /health
        pathType: Exact
        backend:
          service:
            name: nautilus-trader-api
            port:
              number: 8000
      # Metrics endpoint (internal only)
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: nautilus-trader-api
            port:
              number: 9090
      # GraphQL endpoint
      - path: /graphql
        pathType: Exact
        backend:
          service:
            name: nautilus-trader-api
            port:
              number: 8000
      # REST API endpoints
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: nautilus-trader-api
            port:
              number: 8000
      # Documentation
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: nautilus-trader-api
            port:
              number: 8000
      # Default catch-all
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nautilus-trader-api
            port:
              number: 8000
  
  # WebSocket Endpoints
  - host: ws.nautilus-trader.com
    http:
      paths:
      # Health check
      - path: /health
        pathType: Exact
        backend:
          service:
            name: nautilus-trader-websocket
            port:
              number: 8001
      # WebSocket connections
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: nautilus-trader-websocket
            port:
              number: 8001
      # Default WebSocket
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nautilus-trader-websocket
            port:
              number: 8001
  
  # Admin Interface
  - host: admin.nautilus-trader.com
    http:
      paths:
      # RabbitMQ Management
      - path: /rabbitmq
        pathType: Prefix
        backend:
          service:
            name: rabbitmq-management
            port:
              number: 15672
      # Grafana Dashboard
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      # Prometheus
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus-server
            port:
              number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nautilus-trader-canary-ingress
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: ingress
    app.kubernetes.io/version: canary
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    nginx.ingress.kubernetes.io/canary-by-header-value: "always"
    nginx.ingress.kubernetes.io/canary-by-cookie: "canary"
spec:
  tls:
  - hosts:
    - api.nautilus-trader.com
    secretName: nautilus-trader-tls
  rules:
  - host: api.nautilus-trader.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: nautilus-trader-api-canary
            port:
              number: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: nautilus-trader-api-canary
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: api
    app.kubernetes.io/version: canary
spec:
  selector:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: api
    app.kubernetes.io/version: canary
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP