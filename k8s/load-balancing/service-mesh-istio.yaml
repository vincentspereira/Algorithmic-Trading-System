apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: nautilus-trader-gateway
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - api.nautilus-trader.com
    - ws.nautilus-trader.com
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: nautilus-trader-tls
    hosts:
    - api.nautilus-trader.com
    - ws.nautilus-trader.com
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nautilus-trader-api-vs
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: api
spec:
  hosts:
  - api.nautilus-trader.com
  gateways:
  - nautilus-trader-gateway
  http:
  # Health check route (no retries, fast timeout)
  - match:
    - uri:
        exact: /health
    route:
    - destination:
        host: nautilus-trader-api
        port:
          number: 8000
    timeout: 5s
    retries:
      attempts: 0
  
  # GraphQL route with custom timeout
  - match:
    - uri:
        exact: /graphql
    route:
    - destination:
        host: nautilus-trader-api
        port:
          number: 8000
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure,refused-stream
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 100ms
  
  # API routes with load balancing
  - match:
    - uri:
        prefix: /api/v1/trading
    route:
    - destination:
        host: nautilus-trader-api
        port:
          number: 8000
        subset: trading
      weight: 80
    - destination:
        host: nautilus-trader-api
        port:
          number: 8000
        subset: canary
      weight: 20
    timeout: 15s
    retries:
      attempts: 3
      perTryTimeout: 5s
      retryOn: 5xx,reset,connect-failure,refused-stream
  
  # Default API routes
  - match:
    - uri:
        prefix: /api
    route:
    - destination:
        host: nautilus-trader-api
        port:
          number: 8000
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure,refused-stream
    headers:
      request:
        add:
          x-request-id: "%REQ(x-request-id)%"
          x-forwarded-proto: "https"
      response:
        add:
          x-content-type-options: "nosniff"
          x-frame-options: "DENY"
          x-xss-protection: "1; mode=block"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nautilus-trader-websocket-vs
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: websocket
spec:
  hosts:
  - ws.nautilus-trader.com
  gateways:
  - nautilus-trader-gateway
  http:
  # Health check
  - match:
    - uri:
        exact: /health
    route:
    - destination:
        host: nautilus-trader-websocket
        port:
          number: 8001
    timeout: 5s
  
  # WebSocket connections with session affinity
  - match:
    - uri:
        prefix: /ws
    route:
    - destination:
        host: nautilus-trader-websocket
        port:
          number: 8001
    timeout: 0s  # No timeout for WebSocket connections
    headers:
      request:
        add:
          x-forwarded-proto: "https"
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: nautilus-trader-api-dr
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: api
spec:
  host: nautilus-trader-api
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
        keepAlive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
        minHealthPercent: 30
    circuitBreaker:
      consecutiveGatewayErrors: 5
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
  subsets:
  - name: trading
    labels:
      version: stable
    trafficPolicy:
      loadBalancer:
        consistentHash:
          httpHeaderName: "x-user-id"
  - name: canary
    labels:
      version: canary
    trafficPolicy:
      loadBalancer:
        simple: ROUND_ROBIN
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: nautilus-trader-websocket-dr
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: websocket
spec:
  host: nautilus-trader-websocket
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpCookie:
          name: "session-id"
          ttl: 3600s
    connectionPool:
      tcp:
        maxConnections: 1000
        connectTimeout: 30s
        keepAlive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 1000
        http2MaxRequests: 10000
        maxRequestsPerConnection: 1
        idleTimeout: 900s
        h2UpgradePolicy: UPGRADE
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: nautilus-trader-mtls
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: security
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: nautilus-trader-authz
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: security
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nautilus-trader
  rules:
  # Allow health checks from anywhere
  - to:
    - operation:
        paths: ["/health", "/ready"]
  
  # Allow API access with valid JWT
  - to:
    - operation:
        paths: ["/api/*"]
    when:
    - key: request.auth.claims[iss]
      values: ["https://auth.nautilus-trader.com"]
    - key: request.auth.claims[aud]
      values: ["nautilus-trader-api"]
  
  # Allow WebSocket connections with valid token
  - to:
    - operation:
        paths: ["/ws/*"]
    when:
    - key: request.headers[authorization]
      values: ["Bearer *"]
  
  # Allow internal service communication
  - from:
    - source:
        principals: ["cluster.local/ns/nautilus-trader/sa/nautilus-trader-sa"]
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: nautilus-trader-metrics
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: telemetry
spec:
  metrics:
  - providers:
    - name: prometheus
  - overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        request_id:
          value: "%{REQUEST_ID}"
        user_id:
          value: "%{REQUEST_HEADERS['x-user-id']}"
        trading_session:
          value: "%{REQUEST_HEADERS['x-trading-session']}"
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: nautilus-trader-tracing
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: telemetry
spec:
  tracing:
  - providers:
    - name: jaeger
  - customTags:
      user_id:
        header:
          name: x-user-id
      trading_session:
        header:
          name: x-trading-session
      request_type:
        header:
          name: x-request-type