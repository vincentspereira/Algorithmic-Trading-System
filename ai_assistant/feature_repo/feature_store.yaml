# Feast Feature Store Configuration for AI Assistant
project: ai_assistant_trading
registry: registry.db
provider: local

# Offline Store Configuration - PostgreSQL
offline_store:
    type: postgres
    host: postgres
    port: 5432
    database: trading_system
    db_schema: public
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

# Online Store Configuration - Redis
online_store:
    type: redis
    connection_string: redis://redis:6379/0

# Entity Key Serialization Version
entity_key_serialization_version: 2

# Feature Server Configuration
feature_server:
    host: 0.0.0.0
    port: 6566
    metrics:
        enabled: true
        port: 8080

# Flags
flags:
    alpha_features: true
    beta_features: true