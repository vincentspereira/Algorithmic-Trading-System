version: '3.8'

services:
  algo-trading-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo-trading-dev
    volumes:
      - .:/app
      - /app/.venv  # Exclude virtual environment from volume mount
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    command: bash