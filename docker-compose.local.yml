services:
  backtest-api:
    build:
      context: ./backtesting/service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - KAFKA_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
    command: ["uvicorn", "backtest_service:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backtesting/service:/app
    depends_on:
      - kafka
      - redis
      - clickhouse
    networks:
      - trading-net

  market-data:
    build:
      context: ./backtesting/service
      dockerfile: Dockerfile
    command: ["python", "data_service.py"]
    environment:
      - KAFKA_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
    volumes:
      - ./backtesting/service:/app
    depends_on:
      - kafka
      - redis
      - clickhouse
    networks:
      - trading-net

  backtest-engine:
    build:
      context: ./backtesting/service
      dockerfile: Dockerfile
    command: ["python", "backtest_executor.py"]
    environment:
      - KAFKA_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
    volumes:
      - ./backtesting/service:/app
    depends_on:
      - kafka
      - redis
      - clickhouse
    networks:
      - trading-net

  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - zookeeper
    networks:
      - trading-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - trading-net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backtesting/service/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - trading-net

  frontend:
    build:
      context: ./frontend/algorithmic-trading-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend/algorithmic-trading-frontend:/app
      - /app/node_modules
    depends_on:
      - backtest-api
    networks:
      - trading-net

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      - kafka
      - redis
      - clickhouse
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge

volumes:
  redis_data:
  clickhouse_data: