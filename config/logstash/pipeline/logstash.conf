# This is the main Logstash configuration file for the Algorithmic Trading System.

input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Add filters here to parse and enrich logs
  # For example, parse a JSON message field
  if [message] {
    json {
      source => "message"
    }
  }

  # Add service name based on Docker container name
  mutate {
    add_field => { "service_name" => "%{[@metadata][docker][container_name]}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "trading-system-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}