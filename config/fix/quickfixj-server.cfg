FileLogPath=/var/lib/quickfixj/logs/server
ConnectionType=acceptor
SocketAcceptPort=9876
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
SenderCompID=SERVER
TargetCompID=CLIENT1
UseDataDictionary=Y
DataDictionary=/etc/quickfixj/FIX44.xml

[session]
BeginString=FIX.4.4
DefaultApplVerID=FIX.4.4