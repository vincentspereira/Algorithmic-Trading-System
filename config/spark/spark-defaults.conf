# Apache Spark Configuration for Iceberg Data Lakehouse
# Optimized for algorithmic trading data processing

# Spark Application Configuration
spark.app.name=TradingSystem-Iceberg
spark.master=spark://iceberg-spark:7077
spark.submit.deployMode=client

# Iceberg Configuration
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type=hive
spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type=rest
spark.sql.catalog.iceberg.uri=http://iceberg-rest:8181
spark.sql.catalog.iceberg.warehouse=s3a://warehouse/
spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint=http://minio:9000
spark.sql.catalog.iceberg.s3.access-key-id=trading_admin
spark.sql.catalog.iceberg.s3.secret-access-key=trading_minio_2024
spark.sql.catalog.iceberg.s3.path-style-access=true

# S3/MinIO Configuration
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=trading_admin
spark.hadoop.fs.s3a.secret.key=trading_minio_2024
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.fast.upload=true
spark.hadoop.fs.s3a.block.size=134217728
spark.hadoop.fs.s3a.multipart.size=134217728
spark.hadoop.fs.s3a.multipart.threshold=134217728
spark.hadoop.fs.s3a.committer.name=magic
spark.hadoop.fs.s3a.committer.magic.enabled=true

# Memory Configuration
spark.executor.memory=2g
spark.executor.memoryFraction=0.8
spark.executor.memoryStorageFraction=0.3
spark.driver.memory=1g
spark.driver.maxResultSize=1g

# Core Configuration
spark.executor.cores=2
spark.executor.instances=2
spark.driver.cores=1
spark.default.parallelism=8
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.advisoryPartitionSizeInBytes=128MB

# Shuffle Configuration
spark.shuffle.service.enabled=false
spark.shuffle.compress=true
spark.shuffle.spill.compress=true
spark.shuffle.file.buffer=64k
spark.shuffle.io.retryWait=5s
spark.shuffle.io.maxRetries=5

# Serialization
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryo.unsafe=true
spark.kryo.registrationRequired=false
spark.kryoserializer.buffer.max=1024m

# Network Configuration
spark.network.timeout=300s
spark.rpc.askTimeout=300s
spark.rpc.lookupTimeout=300s
spark.sql.broadcastTimeout=300s

# Dynamic Allocation
spark.dynamicAllocation.enabled=false
spark.dynamicAllocation.minExecutors=1
spark.dynamicAllocation.maxExecutors=4
spark.dynamicAllocation.initialExecutors=2

# Checkpointing
spark.sql.streaming.checkpointLocation=s3a://warehouse/checkpoints/
spark.sql.recovery.checkpointDir=s3a://warehouse/recovery/

# SQL Configuration
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.skewJoin.enabled=true
spark.sql.cbo.enabled=true
spark.sql.cbo.joinReorder.enabled=true
spark.sql.statistics.histogram.enabled=true
spark.sql.statistics.size.autoUpdate.enabled=true

# Iceberg Specific Optimizations
spark.sql.iceberg.vectorization.enabled=true
spark.sql.iceberg.merge.mode=copy-on-write
spark.sql.iceberg.planning.preserve-data-grouping=true
spark.sql.iceberg.check-nullability=false
spark.sql.iceberg.check-ordering=false

# Time Travel and Versioning
spark.sql.iceberg.handle-timestamp-without-timezone=true
spark.sql.iceberg.time-travel.enabled=true

# Compression
spark.sql.parquet.compression.codec=snappy
spark.sql.parquet.filterPushdown=true
spark.sql.parquet.mergeSchema=false
spark.sql.parquet.binaryAsString=false
spark.sql.parquet.int96AsTimestamp=true
spark.sql.parquet.writeLegacyFormat=false

# ORC Configuration
spark.sql.orc.compression.codec=snappy
spark.sql.orc.filterPushdown=true
spark.sql.orc.splits.include.file.footer=true

# Hive Configuration
spark.sql.hive.metastore.version=2.3.9
spark.sql.hive.metastore.jars=builtin
spark.sql.warehouse.dir=s3a://warehouse/spark-warehouse/

# Event Log Configuration
spark.eventLog.enabled=true
spark.eventLog.dir=s3a://warehouse/spark-events/
spark.eventLog.compress=true
spark.eventLog.rolling.enabled=true
spark.eventLog.rolling.maxFileSize=128m

# History Server Configuration
spark.history.fs.logDirectory=s3a://warehouse/spark-events/
spark.history.ui.port=18080

# UI Configuration
spark.ui.enabled=true
spark.ui.port=4040
spark.ui.retainedJobs=100
spark.ui.retainedStages=100
spark.ui.retainedTasks=1000
spark.ui.killEnabled=true

# Metrics Configuration
spark.metrics.conf.driver.source.jvm.class=org.apache.spark.metrics.source.JvmSource
spark.metrics.conf.executor.source.jvm.class=org.apache.spark.metrics.source.JvmSource
spark.metrics.conf.*.sink.prometheus.class=org.apache.spark.metrics.sink.PrometheusServlet
spark.metrics.conf.*.sink.prometheus.path=/metrics/prometheus

# Security Configuration
spark.authenticate=false
spark.network.crypto.enabled=false
spark.io.encryption.enabled=false
spark.ssl.enabled=false

# Logging Configuration
spark.sql.execution.arrow.pyspark.enabled=true
spark.sql.execution.arrow.pyspark.fallback.enabled=true

# Trading-Specific Optimizations
spark.sql.adaptive.localShuffleReader.enabled=true
spark.sql.adaptive.skewJoin.skewedPartitionFactor=5
spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes=256MB
spark.sql.adaptive.nonEmptyPartitionRatioForBroadcastJoin=0.2

# Streaming Configuration for Real-time Data
spark.sql.streaming.metricsEnabled=true
spark.sql.streaming.ui.enabled=true
spark.sql.streaming.ui.retainedBatches=100
spark.sql.streaming.stopGracefullyOnShutdown=true

# Delta Lake Configuration (if using Delta alongside Iceberg)
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog

# Resource Management
spark.task.cpus=1
spark.task.resource.gpu.amount=0
spark.executor.resource.gpu.amount=0
spark.executor.resource.gpu.discoveryScript=
spark.executor.resource.gpu.vendor=

# Garbage Collection
spark.executor.extraJavaOptions=-XX:+UseG1GC -XX:+UnlockDiagnosticVMOptions -XX:+G1PrintRegionRememberedSetInfo -XX:+PrintGC -XX:+PrintGCDetails -XX:+PrintGCTimeStamps -XX:+PrintGCApplicationStoppedTime
spark.driver.extraJavaOptions=-XX:+UseG1GC -XX:+UnlockDiagnosticVMOptions -XX:+G1PrintRegionRememberedSetInfo

# Python Configuration
spark.pyspark.python=python3
spark.pyspark.driver.python=python3

# R Configuration
spark.r.command=Rscript
spark.r.driver.command=Rscript

# Kubernetes Configuration (for future K8s deployment)
# spark.kubernetes.namespace=trading-system
# spark.kubernetes.authenticate.driver.serviceAccountName=spark-driver
# spark.kubernetes.authenticate.executor.serviceAccountName=spark-executor
# spark.kubernetes.container.image=trading-spark:latest
# spark.kubernetes.driver.podTemplateFile=/opt/spark/conf/driver-pod-template.yaml
# spark.kubernetes.executor.podTemplateFile=/opt/spark/conf/executor-pod-template.yaml

# Additional JARs (will be downloaded at runtime)
# spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.4.2,com.amazonaws:aws-java-sdk-bundle:1.12.565,org.apache.hadoop:hadoop-aws:3.3.4

# Custom Trading Data Processing Settings
spark.sql.adaptive.maxShuffledHashJoinLocalMapThreshold=0
spark.sql.join.preferSortMergeJoin=true
spark.sql.sources.partitionOverwriteMode=dynamic
spark.sql.parquet.datetimeRebaseModeInRead=CORRECTED
spark.sql.parquet.datetimeRebaseModeInWrite=CORRECTED
spark.sql.parquet.int96RebaseModeInRead=CORRECTED
spark.sql.parquet.int96RebaseModeInWrite=CORRECTED

# Timezone Configuration
spark.sql.session.timeZone=UTC
spark.sql.datetime.java8API.enabled=true

# Arrow Configuration for Python Integration
spark.sql.execution.arrow.maxRecordsPerBatch=10000
spark.sql.execution.arrow.pyspark.selfDestruct.enabled=true