# JMX Exporter configuration for Kafka and other JVM-based services
# This configuration exports JVM and Kafka-specific metrics to Prometheus

# Global settings
startDelaySeconds: 0
ssl: false
lowercaseOutputName: false
lowercaseOutputLabelNames: false

# Rules for metric collection and transformation
rules:
  # JVM Memory metrics
  - pattern: 'java.lang<type=Memory><HeapMemoryUsage>(\w+)'
    name: jvm_memory_heap_$1
    type: GAUGE
    help: "JVM heap memory usage"

  - pattern: 'java.lang<type=Memory><NonHeapMemoryUsage>(\w+)'
    name: jvm_memory_nonheap_$1
    type: GAUGE
    help: "JVM non-heap memory usage"

  # JVM Garbage Collection metrics
  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><CollectionCount>'
    name: jvm_gc_collection_count
    labels:
      gc: "$1"
    type: COUNTER
    help: "JVM garbage collection count"

  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><CollectionTime>'
    name: jvm_gc_collection_time_ms
    labels:
      gc: "$1"
    type: COUNTER
    help: "JVM garbage collection time in milliseconds"

  # JVM Thread metrics
  - pattern: 'java.lang<type=Threading><(\w+)>'
    name: jvm_threads_$1
    type: GAUGE
    help: "JVM thread metrics"

  # Kafka Broker metrics
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec><Count>'
    name: kafka_broker_messages_in_total
    type: COUNTER
    help: "Total number of messages received by broker"

  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec><Count>'
    name: kafka_broker_bytes_in_total
    type: COUNTER
    help: "Total bytes received by broker"

  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec><Count>'
    name: kafka_broker_bytes_out_total
    type: COUNTER
    help: "Total bytes sent by broker"

  # Kafka Request metrics
  - pattern: 'kafka.network<type=RequestMetrics, name=RequestsPerSec, request=(.+)><Count>'
    name: kafka_network_requests_total
    labels:
      request: "$1"
    type: COUNTER
    help: "Total number of requests by type"

  - pattern: 'kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(.+)><Count>'
    name: kafka_network_request_time_ms_total
    labels:
      request: "$1"
    type: COUNTER
    help: "Total request time in milliseconds"

  # Kafka Log metrics
  - pattern: 'kafka.log<type=LogFlushStats, name=LogFlushRateAndTimeMs><Count>'
    name: kafka_log_flush_total
    type: COUNTER
    help: "Total number of log flushes"

  - pattern: 'kafka.log<type=LogSize, name=Size, topic=(.+), partition=(.+)><Value>'
    name: kafka_log_size_bytes
    labels:
      topic: "$1"
      partition: "$2"
    type: GAUGE
    help: "Log size in bytes by topic and partition"

  # Kafka Controller metrics
  - pattern: 'kafka.controller<type=KafkaController, name=(.+)><Value>'
    name: kafka_controller_$1
    type: GAUGE
    help: "Kafka controller metrics"

  # Kafka Replica Manager metrics
  - pattern: 'kafka.server<type=ReplicaManager, name=(.+)><Value>'
    name: kafka_replica_manager_$1
    type: GAUGE
    help: "Kafka replica manager metrics"

  # Kafka Producer metrics (if applicable)
  - pattern: 'kafka.producer<type=producer-metrics, client-id=(.+)><(.+)>'
    name: kafka_producer_$2
    labels:
      client_id: "$1"
    type: GAUGE
    help: "Kafka producer metrics"

  # Kafka Consumer metrics (if applicable)
  - pattern: 'kafka.consumer<type=consumer-fetch-manager-metrics, client-id=(.+)><(.+)>'
    name: kafka_consumer_fetch_$2
    labels:
      client_id: "$1"
    type: GAUGE
    help: "Kafka consumer fetch metrics"

  # ZooKeeper metrics (if ZooKeeper JMX is exposed)
  - pattern: 'org.apache.ZooKeeperService<name0=ReplicatedServer_id(.+), name1=replica.(.+), name2=(.+)><(.+)>'
    name: zookeeper_$3_$4
    labels:
      server_id: "$1"
      member_type: "$2"
    type: GAUGE
    help: "ZooKeeper metrics"

  # Generic catch-all for other JMX metrics
  - pattern: '(.+)<(.+)><(.+)>'
    name: jmx_$1_$3
    labels:
      mbean: "$2"
    type: GAUGE
    help: "Generic JMX metric"

# Blacklist patterns to exclude noisy or unnecessary metrics
blacklistObjectNames:
  - "kafka.consumer:type=*,id=*"
  - "kafka.producer:type=*,id=*"
  - "java.lang:type=MemoryPool,name=*"
  - "java.nio:type=BufferPool,name=*"

# Whitelist patterns to include only specific metrics (optional)
# whitelistObjectNames:
#   - "kafka.server:type=BrokerTopicMetrics,*"
#   - "kafka.network:type=RequestMetrics,*"
#   - "java.lang:type=Memory"
#   - "java.lang:type=GarbageCollector,*"