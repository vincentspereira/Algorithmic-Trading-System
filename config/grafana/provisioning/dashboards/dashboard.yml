apiVersion: 1

providers:
  # Trading System Dashboards
  - name: 'nautilus-trader-dashboards'
    orgId: 1
    folder: 'Nautilus Trader'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
    
  # System Overview Dashboard
  - name: 'trading-system-overview'
    orgId: 1
    folder: 'Nautilus Trader'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/trading_system_overview.json
      
  # Data Feeds Dashboard
  - name: 'data-feeds-monitoring'
    orgId: 1
    folder: 'Nautilus Trader'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/data_feeds.json
      
  # Backtesting Dashboard
  - name: 'backtesting-performance'
    orgId: 1
    folder: 'Nautilus Trader'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/backtesting.json