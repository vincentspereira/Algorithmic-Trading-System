apiVersion: 1

datasources:
  # Prometheus datasource for Nautilus Trader metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      queryTimeout: 60s
      timeInterval: 5s
      manageAlerts: true
      alertmanagerUid: alertmanager
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      cacheLevel: 'High'
      disableMetricsLookup: false
      customQueryParameters: ''
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
          urlDisplayLabel: 'View in Jaeger'
    secureJsonData: {}
    
  # Additional Prometheus datasource for high-frequency data feeds metrics
  - name: Prometheus-DataFeeds
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      queryTimeout: 30s
      timeInterval: 1s
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      cacheLevel: 'Medium'
      disableMetricsLookup: false
      customQueryParameters: 'job=nautilus-data-feeds'
    secureJsonData: {}
    
  # Prometheus datasource for backtesting metrics (lower frequency)
  - name: Prometheus-Backtesting
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      queryTimeout: 120s
      timeInterval: 30s
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      cacheLevel: 'Low'
      disableMetricsLookup: false
      customQueryParameters: 'job=nautilus-backtesting'
    secureJsonData: {}

deleteDatasources:
  - name: Prometheus-Old
    orgId: 1