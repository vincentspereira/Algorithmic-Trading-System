# ==============================================================================
# Prometheus Configuration for Production Algorithmic Trading System
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'trading-system'
    environment: 'production'

# ==============================================================================
# Alerting Configuration
# ==============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# ==============================================================================
# Rule Files for Alerting
# ==============================================================================
rule_files:
  - "/etc/prometheus/alert.rules.yml"

# ==============================================================================
# Scrape Configurations
# ==============================================================================
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ----------------------------------------------------------------------------
  # Algorithmic Trading Microservices
  # ----------------------------------------------------------------------------
  - job_name: 'trading_gateway'
    static_configs:
      - targets: ['trading_gateway:8000']
    metrics_path: /metrics

  - job_name: 'risk_management'
    static_configs:
      - targets: ['risk_management:8001']
    metrics_path: /metrics

  - job_name: 'strategy_executor'
    static_configs:
      - targets: ['strategy_executor:8002']
    metrics_path: /metrics

  - job_name: 'market_data_service'
    static_configs:
      - targets: ['market_data_service:8003']
    metrics_path: /metrics

  - job_name: 'kafka_ai_bridge'
    static_configs:
      - targets: ['kafka_ai_bridge:8004']
    metrics_path: /metrics

  - job_name: 'ai_assistant'
    static_configs:
      - targets: ['ai_assistant:8005']
    metrics_path: /metrics

  # ----------------------------------------------------------------------------
  # Core Infrastructure
  # ----------------------------------------------------------------------------
  - job_name: 'kafka'
    static_configs:
      - targets: ['jmx-exporter:5556'] # Kafka JMX metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187'] # Requires a postgres_exporter container

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

# ==============================================================================
# Remote Write (for long-term storage, e.g., Thanos or Mimir)
# ==============================================================================
# remote_write:
#   - url: "http://mimir:8080/api/v1/push"

# ==============================================================================
# Storage Configuration
# ==============================================================================
storage:
  tsdb:
    path: /prometheus
    retention.time: 90d
    retention.size: 20GB