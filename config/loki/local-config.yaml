# Loki Configuration for Algorithmic Trading System
# Optimized for high-throughput log ingestion and retention

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://alertmanager:9093

# Frontend configuration for query splitting
frontend:
  max_outstanding_per_tenant: 256
  compress_responses: true

# Limits configuration for trading system
limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  max_line_size: 256000
  max_entries_limit_per_query: 5000
  max_global_streams_per_user: 5000
  max_chunks_per_query: 2000000
  max_query_length: 721h
  max_query_parallelism: 32
  max_query_series: 500
  cardinality_limit: 100000
  max_concurrent_tail_requests: 10
  retention_period: 744h  # 31 days

# Chunk store configuration
chunk_store_config:
  max_look_back_period: 0s

# Table manager for retention
table_manager:
  retention_deletes_enabled: true
  retention_period: 744h  # 31 days

# Compactor for log retention
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Analytics configuration
analytics:
  reporting_enabled: false

# Tracing configuration
tracing:
  enabled: false

# Memberlist configuration for clustering (disabled for single instance)
memberlist:
  join_members: []

# Runtime configuration
runtime_config:
  file: /etc/loki/runtime-config.yaml

# Storage configuration optimized for trading logs
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# Query scheduler configuration
query_scheduler:
  max_outstanding_requests_per_tenant: 256

# Ingester configuration for high throughput
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_transfer_retries: 0
  wal:
    enabled: true
    dir: /loki/wal
    checkpoint_duration: 5m
    flush_on_shutdown: true
    replay_memory_ceiling: 1GB

# Distributor configuration
distributor:
  ring:
    kvstore:
      store: inmemory

# Index gateway configuration
index_gateway:
  mode: simple

# Querier configuration
querier:
  max_concurrent: 16
  query_timeout: 1m
  tail_max_duration: 1h
  extra_query_delay: 0s

# Query frontend configuration
query_range:
  align_queries_with_step: true
  max_retries: 5
  parallelise_shardable_queries: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 500
        ttl: 1h

# Metrics configuration
metrics_generator:
  registry:
    external_labels: {}
  storage:
    path: /loki/metrics
    remote_write_flush_deadline: 1m

# Log configuration
log_config:
  level: info
  format: json

# Operational configuration
operational:
  log_queries_longer_than: 5s
  log_ingester_queries: true