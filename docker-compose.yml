volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  qdrant_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  minio_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
