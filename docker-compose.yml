  # Cassandra - Wide-column NoSQL database
  cassandra:
    image: cassandra:4.1
    container_name: trading_cassandra
    ports:
      - "9042:9042"  # CQL port
      - "9160:9160"  # Thrift port
    environment:
      CASSANDRA_CLUSTER_NAME: "TradingCluster"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      CASSANDRA_SEEDS: "cassandra"
      CASSANDRA_PASSWORD: "cassandra_password_2024"
      CASSANDRA_USER: "cassandra"
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./database/cassandra:/docker-entrypoint-initdb.d
    networks:
      - phase1_trading_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra_password_2024 -e 'DESCRIBE KEYSPACES'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MongoDB - Document database
  mongodb:
    image: mongo:7.0
    container_name: trading_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "mongo_user"
      MONGO_INITDB_ROOT_PASSWORD: "mongo_password_2024"
      MONGO_INITDB_DATABASE: "trading_system"
      MONGO_REPLICA_SET: "rs0"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb:/docker-entrypoint-initdb.d
    networks:
      - phase1_trading_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

