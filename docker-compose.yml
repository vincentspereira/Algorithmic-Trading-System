version: '3.8'

services:
  # ================================
  # Main Application Service
  # ================================
  nautilus-trader-engine:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    container_name: nautilus-trader-engine
    ports:
      - "8000:8000"
      - "8001:8001"  # Metrics endpoint
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://nautilus:password@postgres:5432/nautilus_trader
      - LOG_LEVEL=INFO
      - MAX_WORKERS=4
      - CACHE_SIZE_MB=512
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
      - postgres
    networks:
      - nautilus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ================================
  # Development Service
  # ================================
  nautilus-dev:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    container_name: nautilus-trader-dev
    ports:
      - "8002:8000"
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      - redis
    networks:
      - nautilus-network
    profiles:
      - dev
    command: ["python", "-m", "uvicorn", "nautilus_trader_engine.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ================================
  # GPU-Enabled Service
  # ================================
  nautilus-gpu:
    build:
      context: .
      target: gpu
      dockerfile: Dockerfile
    container_name: nautilus-trader-gpu
    ports:
      - "8003:8000"
    environment:
      - ENVIRONMENT=production
      - GPU_ENABLED=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
    networks:
      - nautilus-network
    profiles:
      - gpu
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  # ================================
  # Redis Cache Service
  # ================================
  redis:
    image: redis:7.2-alpine
    container_name: nautilus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    networks:
      - nautilus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ================================
  # PostgreSQL Database
  # ================================
  postgres:
    image: postgres:15-alpine
    container_name: nautilus-postgres
    environment:
      - POSTGRES_DB=nautilus_trader
      - POSTGRES_USER=nautilus
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nautilus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautilus -d nautilus_trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # Monitoring Stack - Prometheus
  # ================================
  prometheus:
    image: prom/prometheus:latest
    container_name: nautilus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - nautilus-network
    profiles:
      - monitoring
    restart: unless-stopped

  # ================================
  # Monitoring Stack - Grafana
  # ================================
  grafana:
    image: grafana/grafana:latest
    container_name: nautilus-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - nautilus-network
    profiles:
      - monitoring
    restart: unless-stopped

  # ================================
  # Node Exporter for System Metrics
  # ================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: nautilus-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - nautilus-network
    profiles:
      - monitoring
    restart: unless-stopped

  # ================================
  # cAdvisor for Container Metrics
  # ================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nautilus-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - nautilus-network
    profiles:
      - monitoring
    restart: unless-stopped

  # ================================
  # Log Aggregation - Loki
  # ================================
  loki:
    image: grafana/loki:latest
    container_name: nautilus-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - nautilus-network
    profiles:
      - logging
    restart: unless-stopped

  # ================================
  # Log Shipping - Promtail
  # ================================
  promtail:
    image: grafana/promtail:latest
    container_name: nautilus-promtail
    volumes:
      - ./logs:/var/log/nautilus
      - ./docker/monitoring/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - nautilus-network
    profiles:
      - logging
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  nautilus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
