version: '3.8'

services:
  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - trading-net

  # Apache Kafka for event streaming
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - trading-net

  # Schema Registry for Kafka schema management
  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - trading-net

  # PostgreSQL 17 database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: trading_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin 4 for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5433:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - trading-net
    depends_on:
      - postgres

  # ClickHouse for time-series analytics
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: trading_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DuckDB for fast OLAP queries
  duckdb:
    image: python:3.11-slim
    container_name: duckdb
    working_dir: /app
    volumes:
      - ./config/duckdb:/app/config:ro
      - duckdb_data:/app/data
      - ./nautilus_trader_engine:/app/nautilus_trader_engine:ro
    environment:
      PYTHONPATH: /app
      DUCKDB_DATABASE_PATH: /app/data/trading_research.duckdb
    networks:
      - trading-net
    command: >
      sh -c "
        pip install duckdb pandas pyarrow &&
        python -c 'import duckdb; conn = duckdb.connect(\"/app/data/trading_research.duckdb\"); conn.execute(\"CREATE SCHEMA IF NOT EXISTS trading\"); conn.close(); print(\"DuckDB initialized successfully\")' &&
        tail -f /dev/null
      "
    restart: unless-stopped

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - trading-net

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
    networks:
      - trading-net
    depends_on:
      - prometheus

  # Prometheus JMX Exporter for JVM metrics
  jmx-exporter:
    image: sscaling/jmx-prometheus-exporter:0.19.0
    container_name: jmx-exporter
    ports:
      - "5556:5556"
    volumes:
      - ./config/jmx-exporter/config.yaml:/opt/jmx_prometheus_httpserver.jar/config.yaml:ro
    command: ["5556", "/opt/jmx_prometheus_httpserver.jar/config.yaml"]
    networks:
      - trading-net
    restart: unless-stopped

  # Nautilus Trader Engine (Python-based service)
  nautilus_trader_engine:
    build:
      context: ./nautilus_trader_engine
      dockerfile: Dockerfile
    container_name: nautilus_trader_engine
    volumes:
      - ./nautilus_trader_engine:/app
      - ./config:/app/config:ro
      - duckdb_data:/app/data/duckdb
    working_dir: /app
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: trading_system
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      DUCKDB_DATABASE_PATH: /app/data/duckdb/trading_research.duckdb
    env_file:
      - .env
    networks:
      - trading-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      clickhouse:
        condition: service_healthy
      duckdb:
        condition: service_started
    restart: unless-stopped

  # AI Assistant Service - Phase 3 Implementation
  ai_assistant:
    build:
      context: ./ai_assistant
      dockerfile: Dockerfile
    container_name: ai_assistant
    ports:
      - "8002:8002"
    volumes:
      - ./ai_assistant:/app
      - ./config:/app/config:ro
    working_dir: /app
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: trading_system
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FEAST_FEATURE_SERVER_URL: http://feast:6566
      AI_ASSISTANT_PORT: 8002
      AI_ASSISTANT_HOST: 0.0.0.0
      PHASE2_API_BASE_URL: http://nautilus_trader_engine:8000
      ALLOWED_ORIGINS: "http://localhost:3210,http://localhost:3000,http://localhost:8080"
      # RAG Pipeline Configuration
      QDRANT_URL: http://qdrant:6333
      VECTOR_STORE: qdrant
      EMBEDDING_PROVIDER: sentence_transformers
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
      CHUNK_SIZE: 1000
      CHUNK_OVERLAP: 200
      RAGFLOW_TOP_K: 10
      RAGFLOW_SIMILARITY_THRESHOLD: 0.7
    env_file:
      - .env
    networks:
      - trading-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      feast:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # Lobe Chat Adapter - OpenAI-compatible API bridge
  lobe_chat_adapter:
    build:
      context: ./ai_assistant
      dockerfile: Dockerfile
    container_name: lobe_chat_adapter
    ports:
      - "8003:8003"
    volumes:
      - ./ai_assistant:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app
      AI_ASSISTANT_URL: http://ai_assistant:8002
      LOBE_ADAPTER_PORT: 8003
      LOBE_ADAPTER_HOST: 0.0.0.0
      LOBE_ALLOWED_ORIGINS: "http://localhost:3210,http://localhost:3000"
    env_file:
      - .env
    networks:
      - trading-net
    depends_on:
      - ai_assistant
    restart: unless-stopped
    command: ["python", "lobe_chat_adapter.py"]

  # Lobe Chat Frontend - Modern Chat Interface
  lobe_chat:
    image: lobehub/lobe-chat:latest
    container_name: lobe_chat
    ports:
      - "3210:3210"
    environment:
      # Basic Configuration
      PORT: 3210
      HOSTNAME: 0.0.0.0
      
      # API Configuration - Point to our adapter
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      API_KEY_SELECT_MODE: "manual"
      
      # Custom API Endpoint
      OPENAI_PROXY_URL: "http://localhost:8003/v1"
      
      # UI Configuration
      APP_NAME: "Trading AI Assistant"
      APP_DESCRIPTION: "AI Assistant for Algorithmic Trading System"
      
      # Feature Flags
      ENABLE_OAUTH_SSO: "false"
      ENABLE_NEXT_AUTH: "false"
      SHOW_ACCESS_CODE_CONFIG: "false"
      
      # Model Configuration
      CUSTOM_MODELS: '{"trading-assistant":{"displayName":"Trading Assistant","description":"Specialized AI assistant for algorithmic trading with reasoning capabilities","maxTokens":4000,"temperature":0.7}}'
      
      # Security
      ACCESS_CODE: ""
      
      # Analytics (disabled for local development)
      ENABLE_LANGFUSE: "false"
      ENABLE_ANALYTICS: "false"
      
      # Development
      NODE_ENV: "production"
    networks:
      - trading-net
    depends_on:
      - lobe_chat_adapter
    restart: unless-stopped

  # Frontend Service (PLACEHOLDER - NOT IMPLEMENTED YET)
  # Uncomment when ready to implement frontend application
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: frontend
  #   ports:
  #     - "3001:3000"  # Using 3001 to avoid conflict with Grafana
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules  # Anonymous volume for node_modules
  #   working_dir: /app
  #   environment:
  #     NODE_ENV: development
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #     NEXT_PUBLIC_AI_ASSISTANT_URL: http://localhost:8001
  #     NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
  #   networks:
  #     - trading-net
  #   depends_on:
  #     - nautilus_trader_engine
  #     # - ai_assistant
  #   restart: unless-stopped

  # Qdrant Vector Database for RAG Pipeline
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Feast Feature Store
  feast:
    image: feastdev/feature-server:latest
    container_name: feast
    ports:
      - "6566:6566"
    volumes:
      - ./ai_assistant/feature_repo:/feature_repo
      - feast_data:/data
    working_dir: /feature_repo
    environment:
      FEAST_USAGE: "False"
      PYTHONPATH: /feature_repo
    networks:
      - trading-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6566/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: >
      sh -c "
        if [ ! -f feature_store.yaml ]; then
          echo 'Feature store configuration not found. Please initialize the repository first.'
          exit 1
        fi &&
        feast serve --host 0.0.0.0 --port 6566
      "

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  clickhouse_data:
    driver: local
  duckdb_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  redis_data:
    driver: local
  feast_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  trading-net:
    driver: bridge
    name: trading-network