version: '3.8'

services:
  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - trading-net

  # Apache Kafka for event streaming
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - trading-net

  # Schema Registry for Kafka schema management
  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - trading-net

  # PostgreSQL 17 database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: trading_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin 4 for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trading.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5433:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - trading-net
    depends_on:
      - postgres

  # ClickHouse for time-series analytics
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: trading_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DuckDB for fast OLAP queries
  duckdb:
    image: python:3.11-slim
    container_name: duckdb
    working_dir: /app
    volumes:
      - ./config/duckdb:/app/config:ro
      - duckdb_data:/app/data
      - ./nautilus_trader_engine:/app/nautilus_trader_engine:ro
    environment:
      PYTHONPATH: /app
      DUCKDB_DATABASE_PATH: /app/data/trading_research.duckdb
    networks:
      - trading-net
    command: >
      sh -c "
        pip install duckdb pandas pyarrow &&
        python -c 'import duckdb; conn = duckdb.connect(\"/app/data/trading_research.duckdb\"); conn.execute(\"CREATE SCHEMA IF NOT EXISTS trading\"); conn.close(); print(\"DuckDB initialized successfully\")' &&
        tail -f /dev/null
      "
    restart: unless-stopped

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - trading-net

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    networks:
      - trading-net
    depends_on:
      - prometheus

  # Prometheus JMX Exporter for JVM metrics
  jmx-exporter:
    image: sscaling/jmx-prometheus-exporter:0.19.0
    container_name: jmx-exporter
    ports:
      - "5556:5556"
    volumes:
      - ./config/jmx-exporter/config.yaml:/opt/jmx_prometheus_httpserver.jar/config.yaml:ro
    command: ["5556", "/opt/jmx_prometheus_httpserver.jar/config.yaml"]
    networks:
      - trading-net
    restart: unless-stopped

  # Nautilus Trader Engine (Python-based service)
  nautilus_trader_engine:
    build:
      context: ./nautilus_trader_engine
      dockerfile: Dockerfile
    container_name: nautilus_trader_engine
    volumes:
      - ./nautilus_trader_engine:/app
      - ./config:/app/config:ro
      - duckdb_data:/app/data/duckdb
    working_dir: /app
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: trading_system
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      DUCKDB_DATABASE_PATH: /app/data/duckdb/trading_research.duckdb
    env_file:
      - .env
    networks:
      - trading-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      clickhouse:
        condition: service_healthy
      duckdb:
        condition: service_started
    restart: unless-stopped

  # AI Assistant Service (PLACEHOLDER - NOT IMPLEMENTED YET)
