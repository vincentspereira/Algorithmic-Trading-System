volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  clickhouse_data:
    driver: local
  duckdb_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  # redis_data:  # Uncomment when Redis service is enabled
  #   driver: local

networks:
  trading-net:
    driver: bridge
    name: trading-network