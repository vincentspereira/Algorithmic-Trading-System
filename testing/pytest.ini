# Pytest Configuration for Trading System
# Comprehensive testing configuration for all test types

[tool:pytest]
# Test discovery patterns
python_files = test_*.py *_test.py tests.py
python_classes = Test* *Tests
python_functions = test_*

# Test directories
testpaths = 
    tests/unit
    tests/integration
    tests/system
    tests/performance
    tests/security
    tests/acceptance

# Minimum version requirements
minversion = 7.0

# Add current directory to Python path
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src
    --cov-report=html:reports/coverage/html
    --cov-report=xml:reports/coverage/coverage.xml
    --cov-report=term-missing
    --cov-fail-under=80
    --junitxml=reports/junit/junit.xml
    --html=reports/html/report.html
    --self-contained-html
    --maxfail=5
    --disable-warnings
    -ra

# Test markers for categorization
markers =
    # Test Types
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    system: End-to-end system tests
    performance: Performance and load tests
    security: Security and penetration tests
    acceptance: User acceptance tests
    smoke: Smoke tests for basic functionality
    regression: Regression tests for bug fixes
    
    # Component Categories
    database: Database-related tests
    trading: Trading engine tests
    portfolio: Portfolio management tests
    risk: Risk management tests
    market_data: Market data service tests
    order_management: Order management system tests
    auth: Authentication and authorization tests
    api: API endpoint tests
    ui: User interface tests
    
    # Environment Categories
    local: Tests that run in local environment
    docker: Tests that require Docker containers
    cloud: Tests that require cloud resources
    external: Tests that require external services
    
    # Speed Categories
    fast: Fast tests (< 1 second)
    medium: Medium tests (1-10 seconds)
    slow: Slow tests (> 10 seconds)
    
    # Stability Categories
    stable: Stable tests that rarely fail
    flaky: Tests that may fail intermittently
    experimental: Experimental or new tests
    
    # Priority Categories
    critical: Critical functionality tests
    high: High priority tests
    medium: Medium priority tests
    low: Low priority tests
    
    # Special Categories
    skip: Tests to skip
    xfail: Tests expected to fail
    parametrize: Parametrized tests
    mock: Tests using mocks
    fixture: Tests using fixtures

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging
log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout settings
timeout = 300
timeout_method = thread

# Parallel execution settings
# Uncomment to enable parallel execution
# -n auto uses all available CPU cores
# addopts = ... -n auto

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
    ignore:.*coroutine.*:RuntimeWarning

# Test collection settings
collect_ignore = [
    "setup.py",
    "conftest.py",
    "**/migrations/**",
    "**/node_modules/**",
    "**/venv/**",
    "**/.venv/**",
    "**/build/**",
    "**/dist/**"
]

# Doctest settings
doctest_optionflags = NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL
doctest_ignore_import_errors = true

# Cache settings
cache_dir = .pytest_cache

# Custom test session configuration
# These can be overridden via command line or environment variables
env_override_existing_values = 1
env_files = [
    ".env.test",
    ".env.local"
]