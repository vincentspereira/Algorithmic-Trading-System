[tool:pytest]
# Pytest configuration for Nautilus Trader Engine

# Test discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    stress: Stress tests
    regression: Regression tests
    smoke: Smoke tests
    slow: Slow running tests
    flaky: Tests that may be unstable
    serial: Tests that must run serially

# Test execution
addopts =
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    --cov=nautilus_trader_engine
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=90.0

# Coverage configuration
[coverage:run]
source = nautilus_trader_engine
omit =
    */tests/*
    */test_*
    */conftest.py
    */__pycache__/*
    */migrations/*
    */setup.py
    */_version.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov

# Test filtering and execution control
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning

# Async test support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Parallel execution (disabled by default for stability)
# Uncomment to enable parallel execution
# addopts = --numprocesses=auto --dist=loadfile

# Custom test ordering
# python_classes = *Test*Test Test* *Tests
# python_functions = test_* test_*_* *_test_*