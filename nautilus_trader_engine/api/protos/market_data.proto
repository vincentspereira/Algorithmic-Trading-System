syntax = "proto3";

package market_data;

// Market Data Service for real-time streaming - Phase 2
service MarketData {
    // Stream real-time market data for a set of subscribed symbols.
    // This is a bi-directional stream, but for simplicity, we'll model
    // the client-side as a single request for now.
    rpc StreamMarketData(SubscriptionRequest) returns (stream Tick);
}

// Request message for subscribing to market data streams.
message SubscriptionRequest {
    repeated string symbols = 1; // e.g., ["AAPL", "GOOGL"]
}

// Individual tick message
message Tick {
    string symbol = 1;
    int64 timestamp = 2;     // Unix timestamp in microseconds
    double price = 3;
    double volume = 4;
    string exchange = 5;     // Exchange identifier
    // Bid, ask, and spread can be added back if needed
}