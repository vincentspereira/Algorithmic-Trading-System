name: Dependency Monitoring Workflow

on:
  schedule:
    # Run daily at 6 AM UTC for Tier 1 & 2
    - cron: '0 6 * * *'
    # Run weekly on Monday at 6 AM UTC for Tier 3 & 4  
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Dependency tier to monitor'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'tier1'
          - 'tier2'
          - 'tier3'
          - 'tier4'

jobs:
  monitor-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [tier1, tier2, tier3, tier4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install requests packaging
          
      - name: Monitor ${{ matrix.tier }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIER: ${{ matrix.tier }}
        run: |
          cd services/dependency_management_service
          python monitoring/check_dependencies.py