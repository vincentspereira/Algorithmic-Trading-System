version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REPO_CONFIG=/app/config/repository_management.json
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - NVD_API_KEY=${NVD_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "8000:8000"  # FastAPI
      - "8001:8001"  # Prometheus metrics
    volumes:
      - ./config:/app/config
    networks:
      - monitoring
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:v2.30.3
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:8.2.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Change in production
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana_dashboard.json:/etc/grafana/provisioning/dashboards/dependency_monitoring.json
      - ./grafana_datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml
    networks:
      - monitoring
    depends_on:
      - prometheus

  redis:
    image: redis:6.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  redis_data:
