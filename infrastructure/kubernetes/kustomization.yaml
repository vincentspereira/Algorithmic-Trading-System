apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: nautilus-trader
  namespace: nautilus-trader

# Namespace
namespace: nautilus-trader

# Resources
resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - secrets.yaml
  - postgresql.yaml
  - redis.yaml
  - rabbitmq.yaml
  - nautilus-trader-api.yaml
  - nautilus-trader-websocket.yaml
  - monitoring.yaml
  - ingress.yaml

# Common labels
commonLabels:
  app.kubernetes.io/name: nautilus-trader
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

# Images
images:
  - name: nautilus-trader/api
    newTag: "1.0.0"
  - name: nautilus-trader/websocket
    newTag: "1.0.0"

# ConfigMap generator
configMapGenerator:
  - name: nautilus-trader-config
    files:
      - config/app.conf
      - config/logging.conf
    options:
      disableNameSuffixHash: true

# Secret generator
secretGenerator:
  - name: nautilus-trader-secrets
    type: Opaque
    options:
      disableNameSuffixHash: true

# Patches
patchesStrategicMerge:
  - patches/production-resources.yaml

# Replicas
replicas:
  - name: nautilus-trader-api
    count: 3
  - name: nautilus-trader-websocket
    count: 2
  - name: postgresql
    count: 1
  - name: redis
    count: 1
  - name: rabbitmq
    count: 1