apiVersion: v1
kind: ServiceAccount
metadata:
  name: nautilus-trader-sa
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: rbac
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nautilus-trader-role
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nautilus-trader-rolebinding
  namespace: nautilus-trader
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: nautilus-trader-sa
  namespace: nautilus-trader
roleRef:
  kind: Role
  name: nautilus-trader-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nautilus-trader-cluster-role
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/metrics", "nodes/proxy"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nautilus-trader-cluster-rolebinding
  labels:
    app.kubernetes.io/name: nautilus-trader
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: nautilus-trader-sa
  namespace: nautilus-trader
roleRef:
  kind: ClusterRole
  name: nautilus-trader-cluster-role
  apiGroup: rbac.authorization.k8s.io