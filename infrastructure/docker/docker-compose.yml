version: '3.9'

# ==============================================================================
# YAML Anchor for base Python service configuration to keep the file DRY
# ==============================================================================
x-base-python-service: &base-python-service
  build:
    context: ./nautilus_trader_engine
    dockerfile: Dockerfile.prod # Using a production-optimized Dockerfile
  restart: unless-stopped
  volumes:
    - ./nautilus_trader_engine:/app:ro # Mount code as read-only in prod
    - ./config:/app/config:ro
    - duckdb_data:/app/data/duckdb
  working_dir: /app
  environment:
    PYTHONPATH: /app
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: trading_system
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 9000 # Use native port for python driver
    DUCKDB_DATABASE_PATH: /app/data/duckdb/trading_research.duckdb
  env_file:
    - .env
  networks:
    - trading-net
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1G
      reservations:
        cpus: '0.5'
        memory: 512M

services:
  # ==============================================================================
  # Core Infrastructure Services
  # ==============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    profiles: ["core"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    profiles: ["core"]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: schema-registry
    profiles: ["core"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'INTERNAL://kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ==============================================================================
  # Data Storage Services
  # ==============================================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    profiles: ["core"]
    env_file: .env
    environment:
      POSTGRES_DB: trading_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: clickhouse
    profiles: ["core"]
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: trading_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["core", "ai"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ==============================================================================
  # Algorithmic Trading Services (Week 1-2 Implementations)
  # ==============================================================================
  trading_gateway:
    <<: *base-python-service
    container_name: trading_gateway
    profiles: ["core"]
    command: ["python", "services/trading_gateway.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  risk_management:
    <<: *base-python-service
    container_name: risk_management
    profiles: ["core"]
    command: ["python", "services/risk_management_service.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"] # Assuming health endpoint on 8001
      interval: 30s
      timeout: 10s
      retries: 3

  strategy_executor:
    <<: *base-python-service
    container_name: strategy_executor
    profiles: ["core"]
    command: ["python", "services/strategy_execution_service.py"]
    healthcheck:
      # This service might not have an HTTP endpoint, a script-based check could be better
      test: ["CMD", "python", "-c", "from utils.health import check_service; check_service('strategy_executor')"]
      interval: 30s
      timeout: 10s
      retries: 3

  market_data_service:
    <<: *base-python-service
    container_name: market_data_service
    profiles: ["core"]
    command: ["python", "services/market_data_service.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "from utils.health import check_service; check_service('market_data')"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka_ai_bridge:
    <<: *base-python-service
    container_name: kafka_ai_bridge
    profiles: ["core", "ai"]
    command: ["python", "services/kafka_ai_bridge.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "from utils.health import check_service; check_service('kafka_bridge')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==============================================================================
  # Monitoring & Logging Stack (Week 3 Implementation)
  # ==============================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
    networks:
      - trading-net
    depends_on:
      - prometheus
      - tempo
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  tempo:
    image: grafana/tempo:2.2.0
    container_name: tempo
    profiles: ["monitoring"]
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "14268:14268" # Jaeger HTTP
    volumes:
      - ./config/grafana/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  jmx-exporter:
    image: sscaling/jmx-prometheus-exporter:0.19.0
    container_name: jmx-exporter
    profiles: ["monitoring"]
    ports:
      - "5556:5556"
    command: "5556:/etc/jmx-exporter/config.yaml"
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: elasticsearch
    profiles: ["logging"]
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "xpack.security.enabled=false" # Disable for local dev, enable in prod
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - trading-net
    healthcheck:
      test: "curl -sS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s' | grep -vq '\"status\":\"red\"'"
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  logstash:
    image: docker.elastic.co/logstash/logstash:8.9.0
    container_name: logstash
    profiles: ["logging"]
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.0
    container_name: kibana
    profiles: ["logging"]
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==============================================================================
  # AI Assistant & Frontend Services
  # ==============================================================================
  ai_assistant:
    build:
      context: ./ai_assistant
      dockerfile: Dockerfile.prod
    container_name: ai_assistant
    profiles: ["ai"]
    ports:
      - "8002:8002"
    env_file: .env
    # Add other env vars here
    networks:
      - trading-net
    depends_on:
      - postgres
      - kafka
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  frontend:
    build:
      context: ./frontend/algorithmic-trading-frontend
      dockerfile: Dockerfile.prod
    container_name: frontend
    profiles: ["core"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://localhost/api
    networks:
      - trading-net
    depends_on:
      - trading_gateway
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==============================================================================
  # Backtesting Services
  # ==============================================================================
  backtest-api:
    build:
      context: ./backtesting/service
      dockerfile: Dockerfile
    container_name: backtest-api
    profiles: ["backtesting"]
    ports:
      - "8001:8000"
    environment:
      - KAFKA_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
    command: ["uvicorn", "backtest_service:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./backtesting/service:/app
    depends_on:
      - kafka
      - redis
      - clickhouse
    networks:
      - trading-net

  market-data:
    build:
      context: ./backtesting/service
      dockerfile: Dockerfile
    container_name: market-data
    profiles: ["backtesting"]
    command: ["python", "data_service.py"]
    environment:
      - KAFKA_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
    volumes:
      - ./backtesting/service:/app
    depends_on:
      - kafka
      - redis
      - clickhouse
    networks:
      - trading-net

  backtest-engine:
    build:
      context: ./backtesting/service
      dockerfile: Dockerfile
    container_name: backtest-engine
    profiles: ["backtesting"]
    command: ["python", "backtest_executor.py"]
    environment:
      - KAFKA_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
    volumes:
      - ./backtesting/service:/app
    depends_on:
      - kafka
      - redis
      - clickhouse
    networks:
      - trading-net

# ==============================================================================
# Volumes and Network Configuration
# ==============================================================================
volumes:
  postgres_data:
  pgadmin_data:
  clickhouse_data:
  duckdb_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  redis_data:
  es_data:

networks:
  trading-net:
    driver: bridge
    name: trading-network