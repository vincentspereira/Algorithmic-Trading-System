apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  namespace: algorithmic-trading
  labels:
    app: trading-engine
    component: core
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: trading-engine
  template:
    metadata:
      labels:
        app: trading-engine
        component: core
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: trading-engine-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
      - name: trading-engine
        image: algorithmic-trading/trading-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 9090
          name: grpc
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-cluster-kafka-bootstrap:9092"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: url
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: url
        - name: IB_GATEWAY_HOST
          value: "ib-gateway-service"
        - name: IB_GATEWAY_PORT
          value: "4001"
        - name: IB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: ib-credentials
              key: client-id
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: logs-volume
          mountPath: /app/logs
        - name: temp-volume
          mountPath: /tmp
      volumes:
      - name: config-volume
        configMap:
          name: trading-engine-config
      - name: logs-volume
        emptyDir: {}
      - name: temp-volume
        emptyDir: {}
      nodeSelector:
        workload-type: compute-intensive
      tolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "compute-intensive"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - trading-engine
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: trading-engine-service
  namespace: algorithmic-trading
  labels:
    app: trading-engine
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: metrics
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: grpc
  selector:
    app: trading-engine
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-engine-config
  namespace: algorithmic-trading
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8000
      workers: 4
    
    trading:
      mode: "paper"  # paper or live
      max_positions: 100
      max_order_value: 10000
      risk_limits:
        max_daily_loss: 5000
        max_position_size: 1000
    
    data_feeds:
      primary: "yahoo_finance"
      fallback:
        - "alpha_vantage"
        - "finnhub"
        - "twelve_data"
    
    kafka:
      topics:
        market_data: "market-data"
        orders: "orders"
        trades: "trades"
        positions: "positions"
        risk_events: "risk-events"
    
    logging:
      level: "INFO"
      format: "json"
      handlers:
        - "console"
        - "file"
    
    metrics:
      enabled: true
      port: 8080
      path: "/metrics"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trading-engine-sa
  namespace: algorithmic-trading
  labels:
    app: trading-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: algorithmic-trading
  name: trading-engine-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trading-engine-rolebinding
  namespace: algorithmic-trading
subjects:
- kind: ServiceAccount
  name: trading-engine-sa
  namespace: algorithmic-trading
roleRef:
  kind: Role
  name: trading-engine-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-engine-pdb
  namespace: algorithmic-trading
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: trading-engine
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trading-engine-hpa
  namespace: algorithmic-trading
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trading-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max