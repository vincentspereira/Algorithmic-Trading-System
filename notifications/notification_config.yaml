# Multi-Channel Notification System Configuration
# Institutional-grade notification system with escalation protocols

notification_system:
  name: "Algorithmic Trading System Notifications"
  version: "1.0.0"
  environment: "production"
  
# Channel Configurations
channels:
  teams:
    enabled: true
    webhook_url: "${TEAMS_WEBHOOK_URL}"
    timeout: 30
    retry_attempts: 3
    retry_delay: 5
    rate_limit:
      max_requests: 100
      time_window: 3600  # 1 hour
    message_format: "adaptive_card"
    
  discord:
    enabled: true
    webhook_url: "${DISCORD_WEBHOOK_URL}"
    timeout: 30
    retry_attempts: 3
    retry_delay: 5
    rate_limit:
      max_requests: 50
      time_window: 3600
    message_format: "embed"
    
  email:
    enabled: true
    smtp_server: "${SMTP_SERVER}"
    smtp_port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    use_tls: true
    timeout: 60
    retry_attempts: 3
    retry_delay: 10
    from_address: "alerts@algotrading.system"
    
  pagerduty:
    enabled: true
    integration_key: "${PAGERDUTY_INTEGRATION_KEY}"
    timeout: 30
    retry_attempts: 3
    retry_delay: 5
    
  slack:
    enabled: false  # Optional integration
    webhook_url: "${SLACK_WEBHOOK_URL}"
    timeout: 30
    retry_attempts: 3
    retry_delay: 5
    
  sms:
    enabled: true
    provider: "twilio"
    account_sid: "${TWILIO_ACCOUNT_SID}"
    auth_token: "${TWILIO_AUTH_TOKEN}"
    from_number: "${TWILIO_FROM_NUMBER}"
    timeout: 30
    retry_attempts: 3
    retry_delay: 5

# Alert Severity Levels
severity_levels:
  critical:
    priority: 1
    color: "#FF0000"
    icon: "🚨"
    escalation_time: 300  # 5 minutes
    channels: ["teams", "discord", "email", "pagerduty", "sms"]
    
  high:
    priority: 2
    color: "#FF8C00"
    icon: "⚠️"
    escalation_time: 900  # 15 minutes
    channels: ["teams", "discord", "email", "pagerduty"]
    
  medium:
    priority: 3
    color: "#FFD700"
    icon: "⚡"
    escalation_time: 1800  # 30 minutes
    channels: ["teams", "discord", "email"]
    
  low:
    priority: 4
    color: "#32CD32"
    icon: "ℹ️"
    escalation_time: 3600  # 1 hour
    channels: ["teams", "discord"]
    
  info:
    priority: 5
    color: "#87CEEB"
    icon: "📊"
    escalation_time: null
    channels: ["teams"]

# Escalation Protocols
escalation:
  enabled: true
  max_escalation_level: 3
  
  # Level 1: Initial Alert
  level_1:
    delay: 0
    recipients:
      - type: "role"
        value: "on_call_engineer"
      - type: "role"
        value: "trading_team"
    channels: ["teams", "discord"]
    
  # Level 2: Management Escalation
  level_2:
    delay: 300  # 5 minutes for critical, varies by severity
    recipients:
      - type: "role"
        value: "team_lead"
      - type: "role"
        value: "risk_manager"
    channels: ["teams", "discord", "email"]
    
  # Level 3: Executive Escalation
  level_3:
    delay: 900  # 15 minutes for critical
    recipients:
      - type: "role"
        value: "cto"
      - type: "role"
        value: "head_of_trading"
    channels: ["teams", "email", "pagerduty", "sms"]

# Alert Categories
categories:
  security:
    name: "Security Alerts"
    icon: "🔒"
    default_severity: "high"
    escalation_multiplier: 0.5  # Faster escalation
    
  trading:
    name: "Trading System"
    icon: "📈"
    default_severity: "medium"
    escalation_multiplier: 1.0
    
  infrastructure:
    name: "Infrastructure"
    icon: "🖥️"
    default_severity: "medium"
    escalation_multiplier: 1.2
    
  compliance:
    name: "Compliance"
    icon: "⚖️"
    default_severity: "high"
    escalation_multiplier: 0.8
    
  performance:
    name: "Performance"
    icon: "⚡"
    default_severity: "low"
    escalation_multiplier: 1.5
    
  data:
    name: "Data Quality"
    icon: "📊"
    default_severity: "medium"
    escalation_multiplier: 1.0

# Recipient Groups
recipient_groups:
  on_call_engineer:
    - email: "oncall@algotrading.system"
      phone: "+1234567890"
      teams_id: "oncall-engineer"
      
  trading_team:
    - email: "trading@algotrading.system"
      teams_id: "trading-team"
      
  team_lead:
    - email: "teamlead@algotrading.system"
      phone: "+1234567891"
      teams_id: "team-lead"
      
  risk_manager:
    - email: "risk@algotrading.system"
      phone: "+1234567892"
      teams_id: "risk-manager"
      
  cto:
    - email: "cto@algotrading.system"
      phone: "+1234567893"
      teams_id: "cto"
      
  head_of_trading:
    - email: "headoftrading@algotrading.system"
      phone: "+1234567894"
      teams_id: "head-of-trading"

# Message Templates
templates:
  teams:
    critical: |
      {
        "@type": "MessageCard",
        "@context": "http://schema.org/extensions",
        "themeColor": "FF0000",
        "summary": "Critical Alert: {title}",
        "sections": [{
          "activityTitle": "🚨 CRITICAL ALERT",
          "activitySubtitle": "{timestamp}",
          "facts": [
            {"name": "System", "value": "{system}"},
            {"name": "Severity", "value": "{severity}"},
            {"name": "Category", "value": "{category}"},
            {"name": "Description", "value": "{description}"}
          ]
        }],
        "potentialAction": [{
          "@type": "OpenUri",
          "name": "View Dashboard",
          "targets": [{"os": "default", "uri": "{dashboard_url}"}]
        }]
      }
      
  discord:
    critical: |
      {
        "embeds": [{
          "title": "🚨 CRITICAL ALERT",
          "description": "{title}",
          "color": 16711680,
          "timestamp": "{iso_timestamp}",
          "fields": [
            {"name": "System", "value": "{system}", "inline": true},
            {"name": "Severity", "value": "{severity}", "inline": true},
            {"name": "Category", "value": "{category}", "inline": true},
            {"name": "Description", "value": "{description}", "inline": false}
          ],
          "footer": {"text": "Algorithmic Trading System"}
        }]
      }
      
  email:
    critical: |
      Subject: 🚨 CRITICAL ALERT: {title}
      
      CRITICAL SYSTEM ALERT
      
      System: {system}
      Severity: {severity}
      Category: {category}
      Timestamp: {timestamp}
      
      Description:
      {description}
      
      Dashboard: {dashboard_url}
      
      This is an automated alert from the Algorithmic Trading System.
      Please investigate immediately.

# Rate Limiting and Throttling
rate_limiting:
  enabled: true
  
  # Global rate limits
  global:
    max_alerts_per_minute: 50
    max_alerts_per_hour: 500
    
  # Per-category limits
  per_category:
    security: 20
    trading: 30
    infrastructure: 25
    compliance: 15
    performance: 40
    data: 35
    
  # Duplicate suppression
  deduplication:
    enabled: true
    time_window: 300  # 5 minutes
    similarity_threshold: 0.8

# Alert Acknowledgment
acknowledgment:
  enabled: true
  timeout: 1800  # 30 minutes
  auto_resolve: false
  
  # Acknowledgment channels
  channels:
    - "teams"
    - "discord"
    - "web_dashboard"

# Maintenance Windows
maintenance:
  enabled: true
  suppress_alerts: true
  
  # Scheduled maintenance windows
  windows:
    - name: "Weekly Maintenance"
      schedule: "0 2 * * SUN"  # Every Sunday at 2 AM
      duration: 7200  # 2 hours
      
    - name: "Monthly Security Updates"
      schedule: "0 1 1 * *"  # First day of month at 1 AM
      duration: 14400  # 4 hours

# Health Checks
health_checks:
  enabled: true
  interval: 60  # seconds
  
  checks:
    - name: "Teams Webhook"
      type: "http"
      url: "${TEAMS_WEBHOOK_URL}"
      timeout: 10
      
    - name: "Discord Webhook"
      type: "http"
      url: "${DISCORD_WEBHOOK_URL}"
      timeout: 10
      
    - name: "SMTP Server"
      type: "smtp"
      host: "${SMTP_SERVER}"
      port: 587
      timeout: 15
      
    - name: "PagerDuty API"
      type: "http"
      url: "https://api.pagerduty.com/incidents"
      timeout: 10

# Metrics and Monitoring
metrics:
  enabled: true
  export_interval: 60
  
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"
    
  # Custom metrics
  custom:
    - name: "alerts_sent_total"
      type: "counter"
      description: "Total number of alerts sent"
      labels: ["channel", "severity", "category"]
      
    - name: "alert_delivery_duration_seconds"
      type: "histogram"
      description: "Time taken to deliver alerts"
      labels: ["channel"]
      
    - name: "escalation_triggered_total"
      type: "counter"
      description: "Total number of escalations triggered"
      labels: ["level", "category"]

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  
  # Log destinations
  destinations:
    - type: "file"
      path: "/var/log/notifications/notifications.log"
      rotation: "daily"
      retention: 30
      
    - type: "elasticsearch"
      host: "${ELASTICSEARCH_HOST}"
      index: "notifications-logs"
      
    - type: "stdout"
      enabled: true

# Security Configuration
security:
  encryption:
    enabled: true
    algorithm: "AES-256-GCM"
    key_rotation_interval: 86400  # 24 hours
    
  authentication:
    api_key_required: true
    jwt_validation: true
    
  audit:
    enabled: true
    log_all_events: true
    retention_period: 2592000  # 30 days

# Backup and Recovery
backup:
  enabled: true
  
  # Configuration backup
  config_backup:
    interval: 86400  # Daily
    retention: 30
    location: "/backup/notifications/config"
    
  # Alert history backup
  history_backup:
    interval: 3600  # Hourly
    retention: 90
    location: "/backup/notifications/history"

# Integration Settings
integrations:
  prometheus:
    enabled: true
    scrape_interval: 30
    
  grafana:
    enabled: true
    dashboard_id: "notifications-dashboard"
    
  elk_stack:
    enabled: true
    logstash_host: "${LOGSTASH_HOST}"
    
  jaeger:
    enabled: true
    agent_host: "${JAEGER_AGENT_HOST}"
    
  kafka:
    enabled: true
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS}"
    topic: "notifications"

# Feature Flags
feature_flags:
  smart_routing: true
  ai_powered_deduplication: true
  predictive_escalation: false
  sentiment_analysis: false
  auto_resolution: true
  batch_processing: true
  real_time_analytics: true

# Performance Tuning
performance:
  worker_threads: 10
  queue_size: 1000
  batch_size: 50
  flush_interval: 5
  
  # Connection pooling
  connection_pool:
    max_connections: 100
    idle_timeout: 300
    connection_timeout: 30

# Compliance and Audit
compliance:
  sox_compliance: true
  pci_dss_compliance: true
  gdpr_compliance: true
  
  # Audit requirements
  audit_trail:
    enabled: true
    immutable: true
    digital_signature: true
    
  # Data retention
  data_retention:
    alert_history: 2555  # 7 years for SOX
    audit_logs: 2555
    configuration_changes: 2555

# Disaster Recovery
disaster_recovery:
  enabled: true
  
  # Failover configuration
  failover:
    automatic: true
    health_check_interval: 30
    failover_threshold: 3
    
  # Backup sites
  backup_sites:
    - name: "DR Site 1"
      location: "us-west-2"
      priority: 1
      
    - name: "DR Site 2"
      location: "eu-west-1"
      priority: 2

# Testing and Validation
testing:
  enabled: true
  
  # Automated tests
  automated_tests:
    interval: 3600  # Hourly
    test_all_channels: true
    
  # Load testing
  load_testing:
    enabled: false
    max_concurrent_alerts: 1000
    duration: 300

# Documentation and Help
documentation:
  runbook_url: "https://docs.algotrading.system/notifications"
  troubleshooting_guide: "https://docs.algotrading.system/notifications/troubleshooting"
  escalation_procedures: "https://docs.algotrading.system/notifications/escalation"
  contact_information: "support@algotrading.system"