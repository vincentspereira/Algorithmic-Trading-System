name: Monitor Dependencies

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours for Tier 1
    - cron: '0 0 * * *'    # Daily at midnight for Tier 2
  workflow_dispatch:  # Manual trigger

jobs:
  monitor-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [1, 2]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install requests packaging
          
      - name: Check dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_version_lag.py --tier ${{ matrix.tier }} --token ${{ secrets.GITHUB_TOKEN }}
          python scripts/check_upstream_activity.py --tier ${{ matrix.tier }} --token ${{ secrets.GITHUB_TOKEN }}
          
      - name: Send Notifications
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/send_notifications_new.py \
            --email "vincyspereira@gmail.com" \
            --version-status version_status.json \
            --activity-status activity_status.json
