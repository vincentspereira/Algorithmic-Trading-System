name: Dependency Monitoring

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours for Tier 1
    - cron: '0 0 * * *'    # Daily at midnight for Tier 2
  workflow_dispatch:  # Manual trigger

jobs:
  monitor-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [1, 2]
    
    env:
      NOTIFICATION_EMAIL: vincyspereira@gmail.com

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Monitor Dependencies
        id: monitoring
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Version check
          echo "::group::Checking version lag"
          python scripts/check_version_lag.py \
            --tier ${{ matrix.tier }} \
            --token ${{ secrets.GITHUB_TOKEN }}
          echo "::endgroup::"
          
          # Activity check
          echo "::group::Checking upstream activity"
          python scripts/check_upstream_activity.py \
            --tier ${{ matrix.tier }} \
            --token ${{ secrets.GITHUB_TOKEN }}
          echo "::endgroup::"

      - name: Send Notifications
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/send_notifications.py \
            --email ${{ env.NOTIFICATION_EMAIL }} \
            --version-status version_status.json \
            --activity-status activity_status.json
