name: Continuous Integration and Deployment

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backtesting/service/requirements.txt
    - name: Run unit tests
      run: |
        pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker images
      run: |
        docker-compose -f docker-compose.yml build
        docker-compose -f docker-compose.databases.yml build
        docker-compose -f docker-compose.phase1.yml build

  
  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backtesting/service/requirements.txt
        pip install pytest-benchmark
    - name: Run benchmarks
      run: |
        pytest tests/benchmarks

  e2e-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backtesting/service/requirements.txt
        pip install requests
    - name: Run e2e tests
      run: |
        # Start services in the background
        docker-compose -f docker-compose.databases.yml up -d
        docker-compose -f docker-compose.phase1.yml up -d
        # Wait for services to be healthy
        sleep 30
        pytest tests/e2e

  deploy_to_production:
    runs-on: ubuntu-latest
    needs: e2e-test
    environment:
      name: production
      url: https://your-production-url.com # Replace with your actual production URL
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment script here