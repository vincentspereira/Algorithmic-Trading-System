name: Enhanced Dependency Integration Testing

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'requirements.txt'
      - '**/requirements.txt'
      - 'package*.json'
      - '**/package*.json'
      - 'services/dependency_management_service/dependencies.json'
      - 'services/dependency_management_service/tiers/*.json'
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - '**/requirements.txt'
      - 'package*.json'
      - '**/package*.json'
      - 'services/dependency_management_service/dependencies.json'
      - 'services/dependency_management_service/tiers/*.json'
  workflow_dispatch:
    inputs:
      dependency_name:
        description: 'Specific dependency to test'
        required: false
        type: string
      tier:
        description: 'Dependency tier to test'
        required: false
        type: choice
        options:
          - 'all'
          - 'tier1'
          - 'tier2'
          - 'tier3'
          - 'tier4'
        default: 'all'
      test_type:
        description: 'Type of tests to run'
        required: false
        type: choice
        options:
          - 'all'
          - 'unit'
          - 'integration'
          - 'e2e'
          - 'performance'
          - 'security'
        default: 'all'

jobs:
  setup-test-matrix:
    name: "Setup Test Matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Generate Test Matrix
        id: generate-matrix
        run: |
          python << 'EOF'
          import json
          import os
          
          # Determine what to test based on trigger
          test_tier = "${{ github.event.inputs.tier || 'all' }}"
          specific_dep = "${{ github.event.inputs.dependency_name || '' }}"
          test_type = "${{ github.event.inputs.test_type || 'all' }}"
          
          # Define test scenarios with enhanced testing capabilities
          matrix = {
              "include": []
          }
          
          # Tier 1 - Critical Dependencies (Real-time alerts for CVEs/breaking changes)
          if test_tier in ['all', 'tier1']:
              matrix["include"].extend([
                  {
                      "name": "NautilusTrader Integration Tests",
                      "tier": "tier1",
                      "service": "nautilus_trader_engine",
                      "test_type": "integration",
                      "dependencies": ["nautilus_trader", "nautilus_ibapi"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "python -m pytest tests/integration/nautilus_trader/ -v --junitxml=test-results/nautilus_integration.xml",
                      "performance_benchmark": true,
                      "backtesting_validation": true
                  },
                  {
                      "name": "Kafka Event Bus Tests",
                      "tier": "tier1", 
                      "service": "kafka_service",
                      "test_type": "integration",
                      "dependencies": ["kafka-python", "confluent-kafka", "schema-registry"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "python -m pytest tests/integration/kafka/ -v --junitxml=test-results/kafka_integration.xml",
                      "compatibility_check": true
                  },
                  {
                      "name": "AI Assistant Integration Tests",
                      "tier": "tier1",
                      "service": "ai_assistant",
                      "test_type": "integration",
                      "dependencies": ["langchain", "langgraph", "transformers"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "python -m pytest tests/integration/ai_assistant/ -v --junitxml=test-results/ai_integration.xml"
                  },
                  {
                      "name": "Trading Engine Integration Tests",
                      "tier": "tier1",
                      "service": "trading_engine",
                      "test_type": "e2e",
                      "dependencies": ["nautilus_trader", "ib_insync", "fix8"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "python -m pytest tests/e2e/trading_engine/ -v --junitxml=test-results/trading_e2e.xml",
                      "backtesting_validation": true
                  }
              ])
          
          # Tier 2 - Important Dependencies (Standard daily alerts)
          if test_tier in ['all', 'tier2']:
              matrix["include"].extend([
                  {
                      "name": "Portfolio Optimization Tests",
                      "tier": "tier2",
                      "service": "portfolio_manager",
                      "test_type": "unit",
                      "dependencies": ["PyPortfolioOpt", "Riskfolio-Lib", "QuantLib"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "python -m pytest tests/unit/portfolio_optimization/ -v --junitxml=test-results/portfolio_unit.xml"
                  },
                  {
                      "name": "Technical Analysis Tests",
                      "tier": "tier2",
                      "service": "indicators",
                      "test_type": "unit",
                      "dependencies": ["TA-Lib", "ta", "pandas-ta", "vectorbt"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "python -m pytest tests/unit/technical_analysis/ -v --junitxml=test-results/indicators_unit.xml"
                  },
                  {
                      "name": "Machine Learning Tests",
                      "tier": "tier2",
                      "service": "ml_models",
                      "test_type": "integration",
                      "dependencies": ["scikit-learn", "pytorch", "tensorflow", "xgboost"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "python -m pytest tests/integration/ml_models/ -v --junitxml=test-results/ml_integration.xml",
                      "performance_benchmark": true
                  }
              ])
          
          # Tier 3 - Supporting Dependencies (Weekly summaries)
          if test_tier in ['all', 'tier3']:
              matrix["include"].extend([
                  {
                      "name": "Frontend Dependencies Tests",
                      "tier": "tier3",
                      "service": "frontend",
                      "test_type": "build",
                      "dependencies": ["react", "next.js", "chart.js"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "npm test -- --coverage"
                  },
                  {
                      "name": "UI Components Tests",
                      "tier": "tier3",
                      "service": "ui_components",
                      "test_type": "unit",
                      "dependencies": ["material-ui", "antd", "tailwindcss"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "npm run test:unit"
                  }
              ])
          
          # Tier 4 - Infrastructure Dependencies (Weekly summaries)
          if test_tier in ['all', 'tier4']:
              matrix["include"].extend([
                  {
                      "name": "Infrastructure Components Tests",
                      "tier": "tier4",
                      "service": "infrastructure",
                      "test_type": "smoke",
                      "dependencies": ["prometheus", "grafana", "elasticsearch", "redis"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "python -m pytest tests/smoke/infrastructure/ -v --junitxml=test-results/infra_smoke.xml"
                  },
                  {
                      "name": "Database Integration Tests",
                      "tier": "tier4",
                      "service": "database",
                      "test_type": "integration",
                      "dependencies": ["postgres", "clickhouse", "qdrant", "duckdb"],
                      "docker_compose": "services/dependency_management_service/testing/docker-compose.test.yml",
                      "test_command": "python -m pytest tests/integration/database/ -v --junitxml=test-results/database_integration.xml"
                  }
              ])
          
          # Filter by specific dependency if provided
          if specific_dep:
              matrix["include"] = [
                  test for test in matrix["include"] 
                  if specific_dep.lower() in [dep.lower() for dep in test["dependencies"]]
              ]
          
          # Filter by test type if specified
          if test_type != 'all':
              matrix["include"] = [
                  test for test in matrix["include"] 
                  if test_type == test["test_type"]
              ]
          
          print(f"Generated matrix with {len(matrix['include'])} test scenarios")
          print(json.dumps(matrix, indent=2))
          
          # Set output for GitHub Actions
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          EOF

  dependency-tests:
    name: "${{ matrix.name }}"
    needs: setup-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-test-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libta-lib0-dev
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f "requirements-dev.txt" ]; then pip install -r requirements-dev.txt; fi
          
      - name: Create Test Environment
        run: |
          # Create isolated test environment
          mkdir -p test-results/${{ matrix.service }}
          mkdir -p test-data/${{ matrix.service }}
          
          # Copy service-specific test configuration
          if [ -f "${{ matrix.docker_compose }}" ]; then
            cp "${{ matrix.docker_compose }}" test-docker-compose.yml
          else
            echo "Warning: Docker compose file not found: ${{ matrix.docker_compose }}"
            # Create minimal test compose
            cat > test-docker-compose.yml << 'EOF'
          version: '3.8'
          services:
            test-runner:
              build: .
              environment:
                - TEST_TIER=${{ matrix.tier }}
                - TEST_SERVICE=${{ matrix.service }}
                - PYTHONUNBUFFERED=1
              volumes:
                - .:/app
                - ./test-results:/app/test-results
                - ./test-data:/app/test-data
              command: pytest tests/ -v
          EOF
          fi
          
      - name: Run ${{ matrix.test_type }} Tests
        env:
          TEST_TIER: ${{ matrix.tier }}
          TEST_SERVICE: ${{ matrix.service }}
          DEPENDENCY_NAMES: ${{ join(matrix.dependencies, ',') }}
        run: |
          echo "Running ${{ matrix.test_type }} tests for ${{ matrix.service }}"
          
          # Start test environment
          docker-compose -f test-docker-compose.yml up -d
          
          # Wait for services to be ready
          sleep 30
          
          # Run specific test command
          case "${{ matrix.test_type }}" in
            "integration")
              echo "Running integration tests for ${{ matrix.service }}"
              docker-compose -f test-docker-compose.yml exec -T test-runner ${{ matrix.test_command }}
              ;;
            "unit")
              echo "Running unit tests for ${{ matrix.service }}"
              docker-compose -f test-docker-compose.yml exec -T test-runner ${{ matrix.test_command }}
              ;;
            "e2e")
              echo "Running end-to-end tests for ${{ matrix.service }}"
              docker-compose -f test-docker-compose.yml exec -T test-runner ${{ matrix.test_command }}
              ;;
            "build")
              echo "Running build tests for ${{ matrix.service }}"
              docker-compose -f test-docker-compose.yml exec -T test-runner ${{ matrix.test_command }}
              ;;
            "smoke")
              echo "Running smoke tests for ${{ matrix.service }}"
              docker-compose -f test-docker-compose.yml exec -T test-runner ${{ matrix.test_command }}
              ;;
            "performance")
              echo "Running performance tests for ${{ matrix.service }}"
              docker-compose -f test-docker-compose.yml exec -T test-runner ${{ matrix.test_command }}
              ;;
            "security")
              echo "Running security tests for ${{ matrix.service }}"
              docker-compose -f test-docker-compose.yml exec -T test-runner ${{ matrix.test_command }}
              ;;
          esac
          
      - name: Run Performance Benchmarks
        if: matrix.performance_benchmark == true
        run: |
          echo "Running performance benchmarks for ${{ matrix.service }}"
          docker-compose -f test-docker-compose.yml exec -T test-runner python -m pytest tests/performance/ -v --junitxml=test-results/performance_benchmark.xml
          
      - name: Run Backtesting Validation
        if: matrix.backtesting_validation == true
        run: |
          echo "Running backtesting validation for ${{ matrix.service }}"
          docker-compose -f test-docker-compose.yml exec -T test-runner python -m pytest tests/backtesting/ -v --junitxml=test-results/backtesting_validation.xml
          
      - name: Run Compatibility Checks
        if: matrix.compatibility_check == true
        run: |
          echo "Running compatibility checks for ${{ matrix.service }}"
          docker-compose -f test-docker-compose.yml exec -T test-runner python -m pytest tests/compatibility/ -v --junitxml=test-results/compatibility_check.xml
          
      - name: Collect Test Results
        if: always()
        run: |
          # Collect logs and test results
          docker-compose -f test-docker-compose.yml logs > test-results/${{ matrix.service }}/logs.txt
          
          # Extract test results if available
          if docker-compose -f test-docker-compose.yml ps | grep test-runner; then
            docker-compose -f test-docker-compose.yml exec -T test-runner find /app -name "*.xml" -o -name "test-*.json" | \
              xargs -I {} docker cp test-runner:{} test-results/${{ matrix.service }}/
          fi
          
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.service }}-${{ matrix.tier }}
          path: test-results/${{ matrix.service }}/
          
      - name: Cleanup
        if: always()
        run: |
          docker-compose -f test-docker-compose.yml down -v
          docker system prune -f

  automated-merge:
    name: "Automated Merge for Non-Critical Updates"
    needs: [setup-test-matrix, dependency-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.dependency-tests.result == 'success'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Determine Merge Strategy
        id: merge-strategy
        run: |
          # Check if this is a non-critical tier update
          tier="${{ github.event.inputs.tier || 'all' }}"
          if [[ "$tier" == "tier3" || "$tier" == "tier4" || "$tier" == "all" ]]; then
            echo "automerge=true" >> $GITHUB_OUTPUT
            echo "This is a non-critical update - can be auto-merged"
          else
            echo "automerge=false" >> $GITHUB_OUTPUT
            echo "This is a critical update - requires manual approval"
          fi
          
      - name: Auto-merge for Tier 3 & 4
        if: steps.merge-strategy.outputs.automerge == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash'
            })
            
      - name: Request Manual Review for Critical Updates
        if: steps.merge-strategy.outputs.automerge == 'false'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Manual Review Required**\n\nThis PR contains updates to critical dependencies (Tier 1 or 2). Please review the test results and approve manually before merging.\n\nTest results are available as artifacts.'
            });

  rollback-pr:
    name: "Create Rollback PR on Test Failures"
    needs: [setup-test-matrix, dependency-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.dependency-tests.result == 'failure'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          
      - name: Create Rollback Branch
        run: |
          git checkout -b rollback-${{ github.event.pull_request.number }}-${GITHUB_RUN_ID}
          # Revert the changes from the failed PR
          git revert --no-commit ${{ github.event.pull_request.head.sha }}
          git commit -m "Rollback: Revert dependency updates from PR #${{ github.event.pull_request.number }}"
          git push origin rollback-${{ github.event.pull_request.number }}-${GITHUB_RUN_ID}
          
      - name: Create Rollback Pull Request
        uses: actions/github-script@v6
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Rollback: Revert dependency updates from PR #' + context.issue.number,
              head: 'rollback-' + context.issue.number + '-${{ GITHUB_RUN_ID }}',
              base: context.payload.pull_request.base.ref,
              body: 'This PR rolls back the dependency updates from PR #' + context.issue.number + ' due to test failures.\n\nPlease review the test results and determine the appropriate action.'
            });
            
            // Add a comment to the original PR with the rollback PR link
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Test Failures Detected**\n\nA rollback PR has been created: #' + pr.number + '\n\n[View Rollback PR](' + pr.html_url + ')'
            });

  test-summary:
    name: "Test Summary and Reporting"
    needs: [setup-test-matrix, dependency-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download All Test Results
        uses: actions/download-artifact@v3
        with:
          path: all-test-results/
          
      - name: Generate Test Report
        run: |
          echo "# Enhanced Dependency Integration Test Results" > test-summary.md
          echo "" >> test-summary.md
          echo "## Test Execution Summary" >> test-summary.md
          echo "" >> test-summary.md
          
          # Count total tests
          total_tests=$(echo '${{ needs.setup-test-matrix.outputs.matrix }}' | jq '.include | length')
          echo "- **Total Test Scenarios:** $total_tests" >> test-summary.md
          
          # Check for any failures
          if [ "${{ needs.dependency-tests.result }}" != "success" ]; then
            echo "- **Status:** ❌ Some tests failed" >> test-summary.md
            echo "- **Action Required:** Review failed tests before merging" >> test-summary.md
          else
            echo "- **Status:** ✅ All tests passed" >> test-summary.md
            echo "- **Dependencies:** Safe to update" >> test-summary.md
          fi
          
          echo "" >> test-summary.md
          echo "## Detailed Results" >> test-summary.md
          echo "" >> test-summary.md
          
          # List all test artifacts
          if [ -d "all-test-results" ]; then
            for dir in all-test-results/*/; do
              if [ -d "$dir" ]; then
                service_name=$(basename "$dir")
                echo "### $service_name" >> test-summary.md
                if [ -f "$dir/logs.txt" ]; then
                  echo "- Logs available in artifacts" >> test-summary.md
                fi
                echo "" >> test-summary.md
              fi
            done
          fi
          
          # Add performance metrics if available
          echo "## Performance Metrics" >> test-summary.md
          echo "" >> test-summary.md
          echo "Performance benchmarks and metrics are available in the test artifacts." >> test-summary.md
          
      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
            
      - name: Set Job Summary
        run: |
          cat test-summary.md >> $GITHUB_STEP_SUMMARY