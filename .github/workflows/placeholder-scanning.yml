name: Placeholder Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Daily scan for placeholders
    - cron: '0 8 * * *'  # 8 AM UTC daily
  workflow_dispatch:

jobs:
  scan-placeholders:
    name: "Scan for @PLACEHOLDER Tags"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install pygithub requests
          
      - name: Scan for Placeholders
        id: scan
        run: |
          python << 'EOF'
          import os
          import re
          import json
          from pathlib import Path
          
          # Pattern to match @PLACEHOLDER: tags
          placeholder_pattern = r'//\s*@PLACEHOLDER:\s*(.+)'
          
          placeholders = []
          exclude_dirs = {'.git', '.venv', 'node_modules', '__pycache__', '.pytest_cache'}
          
          def scan_file(file_path):
              try:
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
                      for i, line in enumerate(lines, 1):
                          match = re.search(placeholder_pattern, line)
                          if match:
                              placeholders.append({
                                  'file': str(file_path),
                                  'line': i,
                                  'description': match.group(1).strip(),
                                  'context': line.strip()
                              })
              except Exception as e:
                  print(f"Error scanning {file_path}: {e}")
          
          # Scan all relevant files
          for root, dirs, files in os.walk('.'):
              # Remove excluded directories
              dirs[:] = [d for d in dirs if d not in exclude_dirs]
              
              for file in files:
                  if file.endswith(('.py', '.js', '.ts', '.tsx', '.jsx', '.go', '.rs', '.cpp', '.hpp', '.c', '.h')):
                      file_path = Path(root) / file
                      scan_file(file_path)
          
          # Output results
          print(f"Found {len(placeholders)} placeholders")
          
          # Set output for GitHub Actions
          with open('placeholders.json', 'w') as f:
              json.dump(placeholders, f, indent=2)
              
          # Set step output
          print(f"::set-output name=count::{len(placeholders)}")
          print(f"::set-output name=has_placeholders::{'true' if placeholders else 'false'}")
          EOF
          
      - name: Upload Placeholder Report
        if: steps.scan.outputs.has_placeholders == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: placeholder-report
          path: placeholders.json
          
      - name: Create GitHub Issues for Placeholders
        if: steps.scan.outputs.has_placeholders == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import json
          import os
          from github import Github
          from datetime import datetime
          
          # Load placeholders
          with open('placeholders.json', 'r') as f:
              placeholders = json.load(f)
          
          # Initialize GitHub client
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['GITHUB_REPOSITORY'])
          
          # Group placeholders by requirement ID if available
          grouped_placeholders = {}
          for placeholder in placeholders:
              # Extract requirement ID from description
              desc = placeholder['description']
              req_match = re.search(r'(REQ-\d+|FRD-\d+|TSD-\d+)', desc)
              req_id = req_match.group(1) if req_match else 'GENERAL'
              
              if req_id not in grouped_placeholders:
                  grouped_placeholders[req_id] = []
              grouped_placeholders[req_id].append(placeholder)
          
          # Create issues for each group
          for req_id, group_placeholders in grouped_placeholders.items():
              title = f"[PLACEHOLDER] {req_id}: Technical Debt Resolution"
              
              body = f"""## Placeholder Technical Debt Resolution
          
          **Requirement ID:** {req_id}
          **Found Placeholders:** {len(group_placeholders)}
          **Scan Date:** {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}
          
          ### Placeholders Found:
          
          """
              
              for i, placeholder in enumerate(group_placeholders, 1):
                  body += f"""
          #### {i}. {placeholder['file']}:{placeholder['line']}
          
          **Description:** {placeholder['description']}
          
          **Context:**
          ```
          {placeholder['context']}
          ```
          
          **File:** [`{placeholder['file']}`]({placeholder['file']}#L{placeholder['line']})
          
          ---
          """
              
              body += f"""
          
          ### Resolution Requirements:
          
          - [ ] Analyze each placeholder and determine implementation approach
          - [ ] Implement missing functionality or create follow-up issues
          - [ ] Remove @PLACEHOLDER tags once resolved
          - [ ] Update tests and documentation as needed
          - [ ] Verify no regressions introduced
          
          ### Acceptance Criteria:
          
          - All @PLACEHOLDER tags in this requirement are resolved or properly deferred
          - Implementation meets the requirement specifications
          - Tests pass and coverage is maintained
          - Documentation is updated
          
          **Priority:** {('High' if req_id != 'GENERAL' else 'Medium')}
          **Phase:** Current Phase Completion Gate
          """
              
              # Check if issue already exists
              existing_issues = repo.get_issues(state='open', labels=['Technical-Debt', 'Placeholder'])
              issue_exists = any(req_id in issue.title for issue in existing_issues)
              
              if not issue_exists:
                  issue = repo.create_issue(
                      title=title,
                      body=body,
                      labels=['Technical-Debt', 'Placeholder', 'Phase-0']
                  )
                  print(f"Created issue #{issue.number}: {title}")
              else:
                  print(f"Issue for {req_id} already exists, skipping creation")
          EOF
          
      - name: Fail Build if Placeholders Found
        if: steps.scan.outputs.has_placeholders == 'true' && github.event_name == 'pull_request'
        run: |
          echo "❌ Found ${{ steps.scan.outputs.count }} placeholder(s) in the codebase"
          echo "Please resolve all @PLACEHOLDER tags before merging to main branch"
          exit 1
          
      - name: Summary
        run: |
          echo "## Placeholder Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Placeholders Found:** ${{ steps.scan.outputs.count }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.scan.outputs.has_placeholders }}" = "true" ]; then
            echo "- **Status:** ⚠️ Action Required" >> $GITHUB_STEP_SUMMARY
            echo "- **Next Steps:** Review created GitHub issues for resolution" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ✅ Clean - No placeholders found" >> $GITHUB_STEP_SUMMARY
          fi