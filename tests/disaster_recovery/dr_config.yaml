# Disaster Recovery Configuration

automation:
  enabled: true
  max_concurrent_tests: 2
  test_timeout: 1800  # 30 minutes in seconds
  cleanup_retention_days: 90

environments:
  production:
    enabled: false  # Disabled by default for safety
    allowed_disaster_types: []
    max_severity: 0.0
    approval_required: true
    business_hours_only: false
    maintenance_window_only: true
  
  staging:
    enabled: true
    allowed_disaster_types:
      - "database_corruption"
      - "system_crash"
      - "network_failure"
      - "storage_failure"
    max_severity: 0.8
    approval_required: false
    business_hours_only: false
    maintenance_window_only: false
  
  development:
    enabled: true
    allowed_disaster_types: "all"
    max_severity: 1.0
    approval_required: false
    business_hours_only: false
    maintenance_window_only: false

notifications:
  email:
    enabled: false
    smtp_server: "smtp.company.com"
    smtp_port: 587
    username: "disaster-recovery@company.com"
    password: "${SMTP_PASSWORD}"
    recipients:
      - "devops@company.com"
      - "sre@company.com"
      - "management@company.com"
  
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channel: "#disaster-recovery"
    username: "DR Bot"
    mention_on_failure: true
    mention_users:
      - "@oncall-engineer"
      - "@dr-lead"
  
  pagerduty:
    enabled: false
    integration_key: "${PAGERDUTY_INTEGRATION_KEY}"
    service_id: "${PAGERDUTY_SERVICE_ID}"
    severity: "high"
    alert_on_failure: true
  
  webhook:
    enabled: false
    url: "${WEBHOOK_URL}"
    headers:
      Authorization: "Bearer ${WEBHOOK_TOKEN}"
      Content-Type: "application/json"

safety:
  max_data_loss_minutes: 60
  max_downtime_minutes: 30
  require_approval_for_production: true
  auto_abort_on_failure: true
  
  # Safety checks before test execution
  pre_test_checks:
    - check_system_health
    - check_backup_availability
    - check_maintenance_window
    - check_recent_incidents
  
  # Automatic abort conditions
  abort_conditions:
    - data_loss_exceeds_threshold
    - downtime_exceeds_threshold
    - critical_system_unavailable
    - manual_abort_signal

backup:
  retention_days: 30
  backup_frequency_hours: 6
  verify_backups: true
  encrypt_backups: true
  compression_enabled: true
  
  # Backup storage locations
  storage_locations:
    primary: "/backups/primary"
    secondary: "/backups/secondary"
    offsite: "s3://disaster-recovery-backups"
  
  # Backup types and schedules
  backup_schedules:
    full_backup:
      frequency: "daily"
      time: "02:00"
      retention_days: 30
    
    incremental_backup:
      frequency: "hourly"
      retention_days: 7
    
    differential_backup:
      frequency: "every_6_hours"
      retention_days: 14

# Recovery objectives
recovery_objectives:
  database:
    rto_minutes: 15  # Recovery Time Objective
    rpo_minutes: 5   # Recovery Point Objective
    priority: "critical"
  
  application_services:
    rto_minutes: 10
    rpo_minutes: 1
    priority: "critical"
  
  configuration:
    rto_minutes: 5
    rpo_minutes: 60
    priority: "high"
  
  logs:
    rto_minutes: 30
    rpo_minutes: 60
    priority: "medium"
  
  user_data:
    rto_minutes: 20
    rpo_minutes: 15
    priority: "high"

# Disaster scenarios configuration
disaster_scenarios:
  database_corruption:
    name: "Database Corruption"
    description: "Test recovery from database corruption"
    severity_levels:
      low: 0.3
      medium: 0.6
      high: 0.9
    affected_components:
      - "database"
      - "application_state"
    recovery_procedures:
      - "stop_application_services"
      - "restore_database_from_backup"
      - "verify_data_integrity"
      - "restart_application_services"
      - "validate_system_functionality"
  
  complete_system_failure:
    name: "Complete System Failure"
    description: "Test recovery from complete system failure"
    severity_levels:
      catastrophic: 1.0
    affected_components:
      - "database"
      - "configuration"
      - "user_data"
      - "application_state"
      - "logs"
    recovery_procedures:
      - "activate_disaster_recovery_site"
      - "restore_all_components"
      - "verify_data_consistency"
      - "update_dns_routing"
      - "validate_all_functionality"
      - "notify_stakeholders"
  
  network_partition:
    name: "Network Partition"
    description: "Test recovery from network partition"
    severity_levels:
      medium: 0.7
      high: 0.9
    affected_components:
      - "database"
      - "application_state"
    recovery_procedures:
      - "detect_network_partition"
      - "initiate_automatic_failover"
      - "redirect_traffic_to_backup"
      - "monitor_data_synchronization"
      - "validate_service_availability"
  
  storage_failure:
    name: "Storage Failure"
    description: "Test recovery from storage system failure"
    severity_levels:
      medium: 0.6
      high: 0.8
    affected_components:
      - "database"
      - "logs"
      - "user_data"
    recovery_procedures:
      - "detect_storage_failure"
      - "switch_to_backup_storage"
      - "restore_data_from_backups"
      - "verify_data_integrity"
      - "resume_normal_operations"

# Test schedules
test_schedules:
  daily_backup_validation:
    scenario: "database_corruption"
    cron: "0 3 * * *"  # Daily at 3 AM
    environment: "staging"
    severity: "low"
    enabled: true
  
  weekly_failover_test:
    scenario: "network_partition"
    cron: "0 2 * * 0"  # Weekly on Sunday at 2 AM
    environment: "staging"
    severity: "medium"
    enabled: true
  
  monthly_full_dr_test:
    scenario: "complete_system_failure"
    cron: "0 1 1 * *"  # Monthly on 1st at 1 AM
    environment: "staging"
    severity: "catastrophic"
    enabled: true
  
  quarterly_storage_test:
    scenario: "storage_failure"
    cron: "0 1 1 */3 *"  # Quarterly on 1st at 1 AM
    environment: "staging"
    severity: "high"
    enabled: true

# Drill configurations
drill_configurations:
  quarterly_comprehensive:
    name: "Quarterly Comprehensive DR Drill"
    duration_hours: 4
    scenarios:
      - "database_corruption"
      - "network_partition"
      - "storage_failure"
    participants:
      - "DevOps Team"
      - "Database Administrators"
      - "Site Reliability Engineers"
      - "Security Team"
      - "Management"
    objectives:
      - "Validate all disaster recovery procedures"
      - "Test team coordination and communication"
      - "Identify gaps in recovery processes"
      - "Ensure RTO/RPO compliance"
      - "Train team on disaster response"
  
  annual_full_scale:
    name: "Annual Full-Scale DR Exercise"
    duration_hours: 8
    scenarios:
      - "complete_system_failure"
    participants:
      - "All Engineering Teams"
      - "Operations Team"
      - "Security Team"
      - "Management"
      - "External Vendors"
    objectives:
      - "Test complete disaster recovery capability"
      - "Validate business continuity plans"
      - "Test external vendor coordination"
      - "Ensure regulatory compliance"
      - "Update disaster recovery documentation"

# Monitoring and metrics
monitoring:
  metrics_collection_interval: 30  # seconds
  
  # System metrics to monitor during DR tests
  system_metrics:
    - cpu_usage
    - memory_usage
    - disk_usage
    - network_latency
    - disk_io
    - network_io
  
  # Application metrics to monitor
  application_metrics:
    - response_time
    - error_rate
    - throughput
    - active_connections
    - queue_depth
    - transaction_rate
  
  # DR-specific metrics
  dr_metrics:
    - backup_size
    - backup_duration
    - restore_duration
    - data_integrity_score
    - recovery_time_actual
    - recovery_point_actual

# Reporting
reporting:
  output_directory: "tests/disaster_recovery/reports"
  formats:
    - json
    - html
    - markdown
    - pdf
  
  # Report sections to include
  sections:
    - executive_summary
    - test_results
    - rto_rpo_analysis
    - data_integrity_assessment
    - lessons_learned
    - recommendations
    - action_items
  
  # Automatic report distribution
  distribution:
    email_reports: true
    slack_summaries: true
    dashboard_updates: true
    management_briefings: true

# Integration settings
integrations:
  monitoring_systems:
    prometheus:
      enabled: false
      endpoint: "http://prometheus:9090"
      push_gateway: "http://pushgateway:9091"
    
    grafana:
      enabled: false
      endpoint: "http://grafana:3000"
      dashboard_id: "disaster-recovery"
    
    datadog:
      enabled: false
      api_key: "${DATADOG_API_KEY}"
      app_key: "${DATADOG_APP_KEY}"
  
  ticketing_systems:
    jira:
      enabled: false
      server: "https://company.atlassian.net"
      username: "${JIRA_USERNAME}"
      api_token: "${JIRA_API_TOKEN}"
      project_key: "DR"
    
    servicenow:
      enabled: false
      instance: "company.service-now.com"
      username: "${SERVICENOW_USERNAME}"
      password: "${SERVICENOW_PASSWORD}"
  
  cloud_providers:
    aws:
      enabled: false
      region: "us-east-1"
      backup_bucket: "disaster-recovery-backups"
      cross_region_replication: true
    
    azure:
      enabled: false
      resource_group: "disaster-recovery"
      storage_account: "drbackups"
    
    gcp:
      enabled: false
      project_id: "disaster-recovery-project"
      bucket: "dr-backups"