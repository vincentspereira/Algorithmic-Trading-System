version: '3.8'

services:
  chaos-engineering:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nautilus-chaos-engineering
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    volumes:
      - ./results:/app/results
      - ./reports:/app/reports
      - ./game_day_reports:/app/game_day_reports
      - ./chaos_config.yaml:/app/chaos_config.yaml:ro
    networks:
      - chaos-network
    depends_on:
      - prometheus
      - grafana
    restart: unless-stopped

  # Monitoring stack for chaos experiments
  prometheus:
    image: prom/prometheus:latest
    container_name: chaos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - chaos-network

  grafana:
    image: grafana/grafana:latest
    container_name: chaos-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=chaos123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - chaos-network

  # Test target services for chaos experiments
  test-api:
    image: nginx:alpine
    container_name: chaos-test-api
    ports:
      - "8081:80"
    volumes:
      - ./test-services/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - chaos-network

  test-database:
    image: postgres:13-alpine
    container_name: chaos-test-db
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chaos-network

  # Redis for caching tests
  test-redis:
    image: redis:7-alpine
    container_name: chaos-test-redis
    ports:
      - "6379:6379"
    networks:
      - chaos-network

  # Test runner service
  chaos-test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaos-test-runner
    command: ["python", "-m", "pytest", "test_chaos_engineering.py", "-v"]
    environment:
      - ENVIRONMENT=test
      - PYTHONPATH=/app
    volumes:
      - ./test-results:/app/test-results
    networks:
      - chaos-network
    depends_on:
      - test-api
      - test-database
      - test-redis
    profiles:
      - testing

networks:
  chaos-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  postgres_data: