# Nginx configuration for chaos engineering test service

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Test API server
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # API endpoints for testing
        location /api/test {
            return 200 '{"message":"Test API response","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # Slow endpoint for latency testing
        location /api/slow {
            access_log off;
            return 200 '{"message":"Slow response","delay":"2s"}';
            add_header Content-Type application/json;
            # Simulate slow response
            limit_rate 1k;
        }

        # Error endpoint for error injection testing
        location /api/error {
            return 500 '{"error":"Simulated server error","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # Metrics endpoint (basic)
        location /metrics {
            access_log off;
            return 200 '# HELP nginx_requests_total Total number of requests
# TYPE nginx_requests_total counter
nginx_requests_total{method="GET",status="200"} 100
nginx_requests_total{method="POST",status="200"} 50
nginx_requests_total{method="GET",status="500"} 5
';
            add_header Content-Type text/plain;
        }

        # Default location
        location / {
            return 200 '{"service":"chaos-test-api","version":"1.0.0","endpoints":["/health","/api/test","/api/slow","/api/error","/metrics"]}';
            add_header Content-Type application/json;
        }
    }
}