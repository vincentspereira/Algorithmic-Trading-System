# Locust configuration file for Algorithmic Trading System performance testing

[locust]
# Core settings
headless = true
users = 100
spawn-rate = 10
run-time = 10m
stop-timeout = 60

# Web UI settings
web-port = 8089
web-host = 0.0.0.0

# Logging
loglevel = INFO
skip-log-setup = false

# Stats
csv-prefix = trading_system_perf
html-file = trading_system_performance_report.html
json-file = trading_system_performance_data.json

# HTTP settings
connection-timeout = 60
network-timeout = 60

# Master/Worker settings
expect-workers = 4
master-bind-host = 0.0.0.0
master-bind-port = 5557

# Other settings
autostart = true
only-summary = false
reset-stats = false