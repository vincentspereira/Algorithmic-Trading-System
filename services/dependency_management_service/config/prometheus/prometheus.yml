global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'dependency-monitoring'
    static_configs:
      - targets: ['monitoring-server:8000']

  - job_name: 'security-service'
    static_configs:
      - targets: ['security-service:8000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
