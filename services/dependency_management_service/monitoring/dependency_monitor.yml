name: Dependency Monitoring

on:
  schedule:
    # Daily monitoring for Tier 1 & 2
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:

jobs:
  check-tier1-tier2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests packaging

      - name: Check Tier 1 & 2 dependencies
        run: |
          python dependency_management/monitoring/check_dependencies.py

      - name: Send notifications
        if: failure()
        run: |
          echo "Dependency check failed - sending notifications"
          # This would integrate with the notification system