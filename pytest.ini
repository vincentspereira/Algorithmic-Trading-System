[tool:pytest]
# Pytest Configuration for Algorithmic Trading System

# Minimum version
minversion = 7.0

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests backtesting/service/tests nautilus_trader_engine/tests

# Directories to not recurse into
norecursedirs = .git .tox .env venv backups forks

# Python path
pythonpath = .

# Add options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=shared
    --cov=services
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-fail-under=80
    --cov-branch
    --html=reports/pytest_report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/pytest_report.json
    --durations=10
    --maxfail=5
    -ra
    -q
    --ignore=forks

# Markers
markers =
    unit: Unit tests - fast, isolated tests
    integration: Integration tests - test component interactions
    e2e: End-to-end tests - full system tests
    benchmark: Benchmark tests for performance measurement
    slow: Slow running tests
    auth: Authentication and authorization tests
    api: API endpoint tests
    database: Database related tests
    security: Security related tests
    performance: Performance and load tests
    smoke: Smoke tests for basic functionality
    regression: Regression tests
    flaky: Tests that may be flaky
    skip_ci: Tests to skip in CI environment
    requires_network: Tests that require network access
    requires_redis: Tests that require Redis
    requires_database: Tests that require database
    trading: Trading engine tests
    market_data: Market data service tests
    risk: Risk management tests
    portfolio: Portfolio management tests
    ai: AI assistant tests
    kafka: Tests requiring Kafka
    redis: Tests requiring Redis
    broker: Tests requiring broker connection
    live_data: Tests requiring live market data
    paper_trading: Paper trading tests
    live_trading: Live trading tests (use with caution)
    backtesting: Backtesting engine tests
    strategy: Strategy development tests
    technical_analysis: Technical analysis tests
    order_management: Order management system tests

# Asyncio configuration
asyncio_mode = auto

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Capture configuration
log_capture = true
log_level = DEBUG
log_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:passlib.*
    ignore::UserWarning:jwt.*
    error::UserWarning:shared.*
    error::UserWarning:services.*

# Test timeout (in seconds)
timeout = 300
timeout_method = thread

# Environment variables for tests
env =
    ENVIRONMENT = test
    LOG_LEVEL = DEBUG
    TESTING = true
    DISABLE_EXTERNAL_CALLS = true
    JWT_SECRET_KEY = test-secret-key-for-testing-only
    DATABASE_URL = sqlite:///:memory:
    REDIS_URL = redis://localhost:6379/1
    KAFKA_BOOTSTRAP_SERVERS = localhost:9092
    KAFKA_TEST_TOPIC_PREFIX = test_
    PAPER_TRADING_MODE = true
    LIVE_TRADING_MODE = false
    MARKET_DATA_SOURCE = mock
    BROKER_CONNECTION = mock
    AI_MODEL_PATH = tests/fixtures/mock_model
    STRATEGY_CONFIG_PATH = tests/fixtures/strategies
    RISK_LIMITS_ENABLED = true
    PORTFOLIO_INITIAL_CASH = 100000.00
